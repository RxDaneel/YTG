<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>YTG</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YTG">
<meta name="theme-color" content="#1a1a19">
<script>try{var t=localStorage.getItem("ytg.theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=3">
<link rel="shortcut icon" href="favicon-32.png?v=3">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* App a colonna singola: barra in alto, contenuto, tab bar fissata al fondo. Palette calda in stile Claude. */
:root{
  --bg:#f3f1ea; --surface:#e9e6dc; --raised:#dfdbcf; --line:#d6d1c4;
  --fg:#141413; --muted:#65635c; --accent:#3b3b38; --on-accent:#f5f4ef; --danger:#c43c3c;
  --glass:rgba(243,241,234,.92);
  --font:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --serif:var(--font);
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --nav-h:58px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1a19; --surface:#242422; --raised:#2e2e2b; --line:#353532;
  --fg:#f5f4ef; --muted:#9c9a92; --accent:#d9d7d1; --on-accent:#1a1a19; --danger:#e06060;
  --glass:rgba(26,26,25,.92); color-scheme:dark;
}}
/* temi scelti nelle impostazioni (prevalgono su chiaro/scuro automatico) */
:root[data-theme="grafite"]{--bg:#1a1a19;--surface:#242422;--raised:#2e2e2b;--line:#353532;--fg:#f5f4ef;--muted:#9c9a92;--accent:#d9d7d1;--on-accent:#1a1a19;--danger:#e06060;--glass:rgba(26,26,25,0.92);color-scheme:dark}
:root[data-theme="carta"]{--bg:#f3f1ea;--surface:#e9e6dc;--raised:#dfdbcf;--line:#d6d1c4;--fg:#141413;--muted:#65635c;--accent:#3b3b38;--on-accent:#f5f4ef;--danger:#c43c3c;--glass:rgba(243,241,234,0.92);color-scheme:light}
:root[data-theme="oled"]{--bg:#000000;--surface:#0e0e0e;--raised:#1a1a1a;--line:#232323;--fg:#f2f2f2;--muted:#8c8c8c;--accent:#e6e6e6;--on-accent:#000000;--danger:#e06060;--glass:rgba(0,0,0,0.92);color-scheme:dark}
/* due temi un po' pazzi */
:root[data-theme="neon"]{--bg:#12062a;--surface:#1e0c42;--raised:#2b1260;--line:#3e1a85;--fg:#fdf0ff;--muted:#b896e0;--accent:#ff2bd6;--on-accent:#12062a;--danger:#ffcc00;--glass:rgba(18,6,42,.88);color-scheme:dark}
:root[data-theme="neon"] body{background:radial-gradient(130% 70% at 50% -10%,#4a1490 0%,#12062a 55%) fixed,#12062a}
:root[data-theme="neon"] #main{background:transparent}
:root[data-theme="neon"] .title,:root[data-theme="neon"] h2{text-shadow:0 0 10px rgba(255,43,214,.45)}
:root[data-theme="neon"] .btn:not(.ghost),:root[data-theme="neon"] .pill.on{box-shadow:0 0 14px rgba(255,43,214,.7),0 0 2px #fff inset}
:root[data-theme="neon"] .thumb{border:1px solid rgba(0,240,255,.35);box-shadow:0 0 18px rgba(0,240,255,.18)}
:root[data-theme="neon"] nav [aria-current="true"]{color:#00f0ff;filter:drop-shadow(0 0 6px #00f0ff)}
:root[data-theme="neon"] .dur{background:#ff2bd6;color:#12062a}
:root[data-theme="term"]{--bg:#020a03;--surface:#061408;--raised:#0b2210;--line:#124a1c;--fg:#41ff74;--muted:#22a845;--accent:#41ff74;--on-accent:#020a03;--danger:#ffb000;--glass:rgba(2,10,3,.92);--font:"SF Mono",ui-monospace,Menlo,"Courier New",monospace;color-scheme:dark}
:root[data-theme="term"] body{text-shadow:0 0 6px rgba(65,255,116,.45)}
:root[data-theme="term"] #main::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
:root[data-theme="term"] .thumb img,:root[data-theme="term"] img.avatar{filter:grayscale(1) sepia(1) hue-rotate(70deg) saturate(3) brightness(.85) contrast(1.1)}
:root[data-theme="term"] .thumb,:root[data-theme="term"] .panel,:root[data-theme="term"] .btn{border-radius:0 !important}
:root[data-theme="term"] .title::before{content:"> "}
:root[data-theme="term"] .dur{background:#020a03;color:#41ff74;border:1px solid #41ff74;border-radius:0}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.themes button{border:1.5px solid var(--line);border-radius:12px;padding:10px 6px 8px;background:var(--surface);color:var(--fg);font:500 12.5px var(--font);display:flex;flex-direction:column;align-items:center;gap:7px}
.themes button[aria-pressed="true"]{border-color:var(--fg)}
.themes .sw{width:44px;height:44px;border-radius:50%;border:1px solid rgba(128,128,128,.35);position:relative;overflow:hidden}
.themes .sw i{position:absolute;right:0;bottom:0;width:50%;height:50%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.4 var(--font)}
/* la pagina non scorre mai: scorre solo <main>. Così su iPhone le barre non possono "staccarsi" (succedeva dopo tastiera o rotazione) */
body{display:flex;flex-direction:column;position:fixed;top:0;left:0;right:0;height:var(--appH,100%)}
button,input,select,textarea{font:inherit;color:inherit}
/* niente zoom: iPhone ingrandisce la pagina se un campo di testo ha caratteri sotto i 16px */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
button{cursor:pointer}
[hidden]{display:none!important}
a{color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:relative;flex:none;z-index:20;background:var(--bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(var(--top) + 6px) 8px 6px 16px;
  display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line)}
header h1{font:700 22px/1.2 var(--serif);margin:0;flex:none;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:9px}
.logo{border:0;background:none;padding:4px 6px 4px 0;color:var(--muted);flex:none;display:flex;align-items:center}
.logo svg{width:42px;height:26px;display:block}
.logo:active{opacity:.6}
#hTitle{display:none}
/* barra di ricerca nella barra in alto */
.hsearch{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:38px;margin:0 4px 0 2px;padding:0 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.hsearch:focus-within{border-color:var(--accent)}
.hsearch svg{width:17px;height:17px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.hsearch input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font:16px var(--font);padding:0;height:100%}
.hsearch input::placeholder{color:var(--muted)}
.hsearch input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
#sClear{flex:none;width:24px;height:24px;margin-right:-4px;border:0;border-radius:50%;background:var(--muted);display:grid;place-items:center;padding:0}
#sClear[hidden]{display:none}
#sClear svg{width:13px;height:13px;stroke:var(--bg);stroke-width:2.6}
/* barretta delle unità usate oggi, al posto della linea sotto la barra in alto */
#qbar{position:absolute;left:0;right:0;bottom:-2px;height:12px;border:0;padding:0;background:none;cursor:pointer;z-index:1}
#qbar::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line)}
#qfill{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--muted);transition:width .4s ease,background .4s}
#qfill.warn{background:var(--fg)}
#qfill.out{background:var(--danger)}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--fg);text-decoration:none}
.icon-btn:active{background:var(--raised)}
.icon-btn.on{background:var(--raised)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:0 0 16px}
.view{max-width:760px;margin:0 auto}

nav{position:relative;flex:none;z-index:30;display:flex;background:var(--bg);border-top:1px solid var(--line);
  padding-bottom:var(--bot)}
nav button{flex:1;height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:var(--fg);font-weight:600}
nav button[aria-current="true"] svg{stroke:var(--fg);stroke-width:2.3}

.searchbar{display:flex;gap:8px;padding:12px 16px 4px}
.searchbar input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none}
.searchbar input:focus{border-color:var(--accent)}

.group{padding:18px 16px 8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{display:block;width:100%;text-align:left;border:0;background:none;padding:0 0 20px}
.cwrap{position:relative}
.cwrap .meta{padding-right:44px}
.cdots{position:absolute;right:6px;bottom:22px;width:36px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.cdots:active{background:var(--raised)}
.cdots svg{width:20px;height:20px;fill:currentColor}
.thumb{position:relative;aspect-ratio:16/9;background:var(--surface);overflow:hidden;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.vprog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.55);z-index:1}
.vprog i{display:block;height:100%;background:#f2f2f2;box-shadow:0 0 4px rgba(0,0,0,.6)}
:root[data-theme="neon"] .vprog i{background:#ff2bd6}
:root[data-theme="term"] .vprog i{background:#41ff74}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cmt.hl{background:var(--raised);border-radius:12px;box-shadow:0 0 0 6px var(--raised);animation:hlflash 1.6s ease 1}
@keyframes hlflash{0%,30%{box-shadow:0 0 0 6px var(--accent)}100%{box-shadow:0 0 0 6px var(--raised)}}
.sbars{display:flex;gap:8px;align-items:flex-end;height:90px;margin-top:14px}
.sbar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.sbar i{display:block;width:100%;max-width:28px;background:var(--raised);border-radius:4px 4px 2px 2px}
.sbar.today i{background:var(--accent)}
.sbar span{font-size:11px;color:var(--muted)}
.stch{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--fg);padding:5px 0;font:inherit;text-align:left}
.stch img{width:26px;height:26px;border-radius:50%;flex:none;background:var(--raised)}
.stch .n{width:34%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.stch .b{flex:1;height:6px;background:var(--raised);border-radius:3px;overflow:hidden}
.stch .b i{display:block;height:100%;background:var(--accent)}
.stch .t{font-size:12px;color:var(--muted);flex:none;min-width:62px;text-align:right}
.shist{padding:4px 0 12px}
.hitem{display:flex;align-items:center}
.hq{flex:1;min-width:0;display:flex;align-items:center;gap:14px;border:0;background:none;color:var(--fg);font:15px var(--font);padding:11px 4px 11px 16px;text-align:left}
.hq svg{width:20px;height:20px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round}
.hq span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hq small{color:var(--muted);font-size:11px;flex:none}
.hx{border:0;background:none;width:44px;height:44px;display:grid;place-items:center;flex:none}
.hx svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.lnk{color:#065fd4;text-decoration:none;word-break:break-all}
@media (prefers-color-scheme:dark){.lnk{color:#3ea6ff}}
:root[data-theme="carta"] .lnk{color:#065fd4}
:root[data-theme="grafite"] .lnk,:root[data-theme="oled"] .lnk{color:#3ea6ff}
:root[data-theme="neon"] .lnk{color:#00f0ff}
:root[data-theme="term"] .lnk{color:#41ff74;text-decoration:underline}
.grow{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line)}
.grow img{width:36px;height:36px;border-radius:50%;flex:none;background:var(--raised)}
.grow span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.grow input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.grpbar{position:sticky;bottom:0;display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tin{width:100%;box-sizing:border-box;font:16px var(--font);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.chaps{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chaps::-webkit-scrollbar{display:none}
#pInfo .chaps{margin:0 -16px}
.chap{flex:none;width:150px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 10px;font:inherit}
.chap .ct{display:block;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.chap .cn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.3;margin-top:2px}
.chap.on{border-color:var(--fg);background:var(--raised)}
.chap.on .ct{color:var(--fg)}
[data-v]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
[data-v] img{-webkit-touch-callout:none}
[data-v] .thumb img{pointer-events:none}
.prev{position:absolute;inset:0;z-index:2}
.prev>:first-child{opacity:0;transition:opacity .5s ease}
.prev.live>:first-child{opacity:1}
.prev:not(.live) .pvol,.prev:not(.live) .pbar{opacity:0}
.prev iframe,.prev>div{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.prev .pbar{position:absolute;left:0;bottom:0;height:3px;background:#e8e6df;width:0;z-index:3;transition:width .4s linear}
.prev .pvol{position:absolute;right:8px;top:8px;z-index:3;width:34px;height:34px;border-radius:50%;border:0;background:rgba(20,20,19,.7);display:grid;place-items:center;pointer-events:auto}
.prev .pvol svg{width:18px;height:18px;stroke:#faf9f5;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.dur{position:absolute;right:8px;bottom:8px;background:rgba(20,20,19,.82);color:#faf9f5;font-size:12px;font-weight:600;padding:2px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.live{background:var(--danger)}
.seen .thumb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}
.seen .thumb img{opacity:.55}
.meta{display:flex;gap:12px;padding:10px 16px 0}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;background:var(--raised);object-fit:cover}
.meta>div{min-width:0}
.title{font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{color:var(--muted);font-size:13px;margin-top:3px}

.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);font:700 21px/1.25 var(--serif);margin:0 0 8px}
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--raised);color:var(--fg)}
.btn:disabled{opacity:.5}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}

.section{padding:16px}
.section h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 10px;font-weight:600}
.panel{background:var(--surface);border-radius:14px;overflow:hidden}
.field{display:flex;gap:8px;padding:12px}
.field input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);outline:none}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .x{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.toggle small{display:block;color:var(--muted);font-size:12px}
.switch{appearance:none;-webkit-appearance:none;width:48px;height:29px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(19px)}
select.pick{background:var(--raised);border:0;border-radius:8px;padding:6px 8px}
.help{color:var(--muted);font-size:13px;line-height:1.55;padding:0 4px}
.help ol{padding-left:20px;margin:8px 0}
.help code{background:var(--raised);padding:1px 4px;border-radius:4px;font-size:12px;word-break:break-all}
.status{font-size:12.5px;color:var(--muted);padding:6px 4px}
.status.err{color:var(--danger)}

.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;
  padding-top:var(--top);padding-bottom:calc(var(--bot) + 24px);transform:translateY(100%);transition:transform .28s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.pbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--bg)}
.pbar h3{flex:1;margin:0;font:700 19px var(--serif)}
.frame{aspect-ratio:16/9;background:#000;width:100%;max-width:100%}
.frame iframe{width:100%;height:100%;border:0;display:block}
.pinfo{padding:14px 16px;max-width:100%;overflow:hidden}
.pinfo>*{min-width:0;max-width:100%}
.pinfo h2{font:700 20px/1.3 var(--serif);margin:0 0 8px;text-wrap:balance}
.chan{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px}
.chan .avatar{width:28px;height:28px}
#pInfo>.sub{font-size:12px}
.desc{white-space:pre-wrap;color:var(--muted);font-size:12.5px;line-height:1.45;background:var(--surface);border-radius:10px;padding:10px 12px;max-height:4.6em;overflow:hidden;overflow-wrap:anywhere}
.desc.full{max-height:none}
.more{border:0;background:none;color:var(--fg);padding:6px 0;font-size:12.5px;font-weight:600}

.vt{font:700 18px/1.3 var(--font);margin:0;text-wrap:pretty;overflow-wrap:anywhere}
.vmeta{min-width:0;overflow-wrap:anywhere;font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.vmeta b{color:var(--fg);font-weight:500}

.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + var(--nav-h) + 14px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.frame{position:relative}
#unmute{position:absolute;left:12px;bottom:12px;z-index:3;border:0;border-radius:999px;padding:8px 14px;background:rgba(20,20,19,.85);color:#fff;font-size:13px;font-weight:600}
/* controlli propri sotto al video (verticale) o sopra in basso (schermo intero) */
.pwrap{position:relative;background:#000}
.ctl{background:var(--bg);padding:2px 4px 6px}
.crow{display:flex;align-items:center;gap:0;min-width:0;max-width:100%}
.cb{width:36px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--fg);flex:none}
.cb:active{background:var(--raised)}
.cb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cb svg .f{fill:currentColor;stroke:none}
.cb.txt.on{background:var(--fg);color:var(--bg)}

#cSeek{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;display:block}

#cSeek::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);margin-top:-5px}
#cSeek::-moz-range-track{height:3px;background:var(--line)}
#cSeek::-moz-range-progress{height:3px;background:var(--fg)}
.reveal{display:none}
.land #player.open .pwrap,.full #player.open .pwrap{position:absolute;left:0;top:0;width:100%;height:var(--vh,100vh);z-index:5}
.land #player.open .ctl,.full #player.open .ctl{position:absolute;left:0;right:0;bottom:0;padding:24px 14px calc(var(--bot) + 8px);
  background:linear-gradient(transparent,rgba(0,0,0,.75));opacity:0;transition:opacity .25s;pointer-events:none;--fg:#fff;--line:rgba(255,255,255,.35);--muted:rgba(255,255,255,.8)}
.land #player.open .ctl.show,.full #player.open .ctl.show{opacity:1}
.land #player.open .ctl.show :is(button,input),.full #player.open .ctl.show :is(button,input){pointer-events:auto}
/* toccando il video a schermo intero compaiono/spariscono i comandi; l'angolo in basso a destra resta libero per il "Salta" della pubblicità */
.land #player.open .reveal,.full #player.open .reveal{display:block;position:absolute;inset:0;z-index:2;
  clip-path:polygon(0 0,100% 0,100% 62%,58% 62%,58% 100%,0 100%)}
.land #player.open .ctl,.full #player.open .ctl{z-index:3}
.full #player.open{overflow:hidden;padding:0;background:#000}
.full #player.open .pbar,.full #player.open .pinfo{display:none}
.full:not(.land) #player.open .frame{width:100%;height:100%;aspect-ratio:auto}
/* telefono in orizzontale: il player occupa tutto lo schermo, il resto si nasconde */
.land #player.open{overflow:hidden;padding:0;background:#000}
.land #player.open .pbar,.land #player.open .pinfo{display:none}
/* in orizzontale il player copre esattamente lo schermo (misurato in JS) e il video resta intero e centrato,
   con le bande nere ai lati come nell'app di YouTube: niente zoom e niente spostamento verso destra */
.land #player.open .pwrap{position:fixed;left:0;top:0;width:var(--vw,100vw);height:var(--vh,100vh);overflow:hidden;background:#000}
.land #player.open .frame{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;max-width:none;transform:none}
#ptr{position:fixed;left:50%;top:calc(var(--top) + 58px);z-index:15;width:38px;height:38px;margin-left:-19px;border-radius:50%;
  background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.3);display:grid;place-items:center;opacity:0;transform:translateY(-50px);pointer-events:none}
#ptr svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#ptr.go svg{animation:spin 1s linear infinite}
#ptr.back{transition:transform .25s ease,opacity .25s ease}
/* player di YouTube con i suoi comandi: la barra di YTG e lo strato per mostrarla sono nascosti */
#pCtl,.reveal{display:none!important}
/* gesto "indietro": trascina dal bordo sinistro verso destra per chiudere la pagina aperta */
#edge{position:fixed;left:0;top:0;bottom:0;width:16px;z-index:9999;touch-action:none}
.sheet.dragging{box-shadow:-10px 0 30px rgba(0,0,0,.45)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.spin svg{animation:none}}
</style>

<script>
"use strict";
const API = "https://www.googleapis.com/youtube/v3/";
const LS = "ytg.v1";

/* ---------- stato ---------- */
const DEF_OPT = { inlinePrev: true, hideWatched: false, perChannel: 8, showHome: true, region: "IT", homeSearch: true };
const S = Object.assign({
  key: "", clientId: "", token: "", tokenExp: 0, tokenScope: "", me: null, lastSync: 0,
  channels: [], videos: [], lastFetch: 0, watched: {}, avatars: {}, noLF: {},
  home: [], homeFetch: 0, homeMode: "", homeTags: [], seenNotif: 0, likes: [], hist: [], blocked: {},
  chMeta: {}, sCache: {}, relCache: {}, lastCost: null, nope: [], hidden: {}, homeSeen: {}, homePage: {}, chartTok: {}
}, load());
S.opt = Object.assign({}, DEF_OPT, S.opt || {});
S.opt.cc = ""; S.opt.ccTr = "";                 // niente sottotitoli automatici: si scelgono video per video dal lettore
/* Chiave e ID client già inseriti: così, reinstallando l'app sulla Home, non vanno incollati di nuovo.
   La chiave è visibile a chiunque apra il codice del sito: va limitata nella console Google a rxdaneel.github.io/* e alla sola YouTube Data API. */
const DEFAULT_KEY = "AIzaSyBosG9sO5iElJzGat5-BkeLzqA1ZXj2FH4";
const DEFAULT_CLIENT = "492839226235-qhlirhn4n0c0ag4nkescckthv0v413jk.apps.googleusercontent.com";
if (!S.key) S.key = DEFAULT_KEY;
if (!S.clientId) S.clientId = DEFAULT_CLIENT;
function load(){ try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } }

/* Le liste grandi (video, avatar, cache) vanno in IndexedDB: localStorage su iPhone tiene circa 5 MB,
   e se si riempie l'app "dimentica" tutto e riscarica ogni volta, consumando unità. */
const BIG = ["videos", "home", "avatars", "chMeta", "sCache", "relCache", "meData", "later", "homeSeen", "pos", "chap", "marks", "stats"];
let idb = null, bigReady = false, saveT = 0, resetting = false;
function idbOpen(){
  return new Promise(res => {
    try {
      const r = indexedDB.open("ytg", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = r.onblocked = () => res(null);
    } catch { res(null); }
  });
}
function idbGet(k){
  return new Promise(res => {
    try { const q = idb.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }
    catch { res(undefined); }
  });
}
function idbPut(obj){ try { const st = idb.transaction("kv", "readwrite").objectStore("kv"); for (const k in obj) st.put(obj[k], k); } catch {} }
function idbClear(){
  return new Promise(res => {
    try { const t = idb.transaction("kv", "readwrite"); t.objectStore("kv").clear(); t.oncomplete = t.onerror = () => res(); }
    catch { res(); }
  });
}
async function loadBig(){

/* Quota: 10.000 unità al giorno, azzerate a mezzanotte in California (le 9:00 in Italia) */
const qDay = () => new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" });
function spend(path, method){
  const cost = path.startsWith("search") ? 100 : (method && method !== "GET") ? 50 : 1;
  const d = qDay(); if (S.qDay !== d) { S.qDay = d; S.qUsed = 0; S.quotaOut = ""; }
  S.qUsed = (S.qUsed || 0) + cost;
  paintQuota();
}
function paintQuota(){
  const f = document.getElementById("qfill"); if (!f) return;
  const used = S.qDay === qDay() ? S.qUsed || 0 : 0, out = S.quotaOut === qDay();
  f.style.width = (out ? 100 : Math.min(100, used / 100)) + "%";
  f.classList.toggle("warn", !out && used >= 7000);
  f.classList.toggle("out", out);
}
const quotaOut = () => S.quotaOut === qDay();
function markQuota(e){ if (e?.reason === "quotaExceeded") { S.quotaOut = qDay(); save(); paintQuota(); } }

async function api(path, params){
  if (!S.key) throw new Error("Manca la chiave API: aggiungila in Impostazioni.");
  spend(path, "GET");
  const r = await fetch(API + path + "?" + new URLSearchParams({ ...params, key: S.key }));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e = new Error(j.error?.message || ("Errore " + r.status));
    e.status = r.status; e.reason = j.error?.errors?.[0]?.reason; markQuota(e); throw e;
  }
  return j;
}

/* ---------- accesso Google (OAuth) ---------- */
const SCOPE = "https://www.googleapis.com/auth/youtube.force-ssl";   // lettura iscrizioni + scrittura commenti
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/, "");
const tokenOk = () => S.token && S.tokenScope === SCOPE && Date.now() < S.tokenExp - 60000;

function startLogin(after){
  if (!S.clientId) { toast("Prima inserisci l'ID client in Impostazioni"); closeSheets(); go("vSettings"); return; }
  const state = Math.random().toString(36).slice(2);
  try { sessionStorage.setItem("ytg.state", state); sessionStorage.setItem("ytg.after", JSON.stringify(after || { do: "sync" })); } catch {}
  const p = new URLSearchParams({ client_id: S.clientId, redirect_uri: redirectUri(), response_type: "token",
    scope: SCOPE, include_granted_scopes: "true", state,
    ...(after?.silent ? { prompt: "none" } : S.me && !after?.pick ? {} : { prompt: "select_account" }) });
  saveNow();
  location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + p;
}

/* L'accesso di Google per le web app dura un'ora e non può essere reso permanente senza un server.
   Quando scade, YTG lo rinnova in silenzio: va da Google con prompt=none e, se sei ancora collegato,
   torna subito indietro con un nuovo accesso, senza chiederti nulla. Solo se Google vuole una conferma compare il pulsante. */
function reauth(after){
  if (S.me && (!S.silentFail || Date.now() - S.silentFail > 6 * 3600000)) return startLogin({ ...after, silent: true });
  return startLogin(after);
}
function readLoginReturn(){
  if (!location.hash.includes("access_token") && !location.hash.includes("error=")) return null;
  const h = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, "", location.pathname);
  let st = null, after = { do: "sync" };
  try { st = sessionStorage.getItem("ytg.state"); after = JSON.parse(sessionStorage.getItem("ytg.after")) || after; } catch {}
  if (h.get("error")) {
    if (after.silent) { S.silentFail = Date.now(); save(); return { do: "silentFailed", orig: after }; }
    setTimeout(() => toast("Accesso annullato"), 300); return null;
  }
  if (after.silent) S.silentFail = 0;
  if (st && h.get("state") !== st) { setTimeout(() => toast("Accesso non valido, riprova"), 300); return null; }
  S.token = h.get("access_token"); S.tokenScope = SCOPE;
  S.tokenExp = Date.now() + (+h.get("expires_in") || 3600) * 1000; save();
  return after;
}

async function apiAuth(path, params, body){
  spend(path, body ? "POST" : "GET");
  const r = await fetch(API + path + "?" + new URLSearchParams(params), {
    method: body ? "POST" : "GET",
    headers: { Authorization: "Bearer " + S.token, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { S.token = ""; save(); const e = new Error("Sessione scaduta: accedi di nuovo"); e.relogin = true; throw e; }
  if (!r.ok) { const e = new Error(j.error?.message || ("Errore " + r.status)); e.reason = j.error?.errors?.[0]?.reason; throw e; }
  return j;
}

function secs(iso){

/* Lingua di un video: "it", "en", "x" (altra lingua) o "" (non si capisce). Usa la lingua dichiarata dal canale e, se manca, il titolo. */
const LW = {
  it: "il gli della delle degli dello nel nella nei negli sono che non questo questa perché anche più ecco cosa tutto tutti ho abbiamo ma alla alle ai dei è sei siamo fatto nuovo nuova recensione guida primo prima ancora molto quando dove meglio migliore come provato",
  en: "the and of to is how what why with my you your this for new best review guide i it on from first will can all about we are was my our vs ever just get made these that",
  es: "el los las para cómo como qué por pero muy más mejor esto este esta hay también ya cuando sin y juego nueva todo todos así porque",
  pt: "não você com uma os do da dos das mais isso muito jogo também melhor pra vocês",
  fr: "les des du et est pour avec une dans pas sur ce cette je c'est nouveau meilleur au aux comment",
  de: "der die das und ist mit nicht ein eine ich auf für wie den dem zu von auch neue besten"
};
const LSET = Object.fromEntries(Object.entries(LW).map(([k, s]) => [k, new Set(s.split(" "))]));
const NONLATIN = /[Ͱ-ϿЀ-ԯ԰-֏֐-׿؀-ۿऀ-෿฀-๿ᄀ-ᇿ぀-ヿ㐀-鿿가-힯]/;
const OTHERCH = /[ñ¿¡ãõçêâôßäöüğışłąężśćńřěůőűẞẠ-ỹ]/i, ACUTE = /[áíóú]/i;
function textLang(text){
  if (NONLATIN.test(text)) return "x";
  const t = text.toLowerCase(), sc = { it: 0, en: 0, es: 0, pt: 0, fr: 0, de: 0 };
  for (const w of t.split(/[^a-zà-ÿ']+/)) for (const k in LSET) if (LSET[k].has(w)) sc[k]++;
  let other = Math.max(sc.es, sc.pt, sc.fr, sc.de);
  if (OTHERCH.test(t)) other += 2;
  if (ACUTE.test(t)) other += 1;
  const mine = Math.max(sc.it, sc.en);
  if (other >= 2 && other > mine) return "x";
  if (mine && other <= mine) return sc.it > sc.en ? "it" : "en";
  return other > mine ? "x" : "";
}
function videoLang(v){
  const l = v.lang || "";
  if (NONLATIN.test(v.title || "")) return "x";
  if (/^(it|en)\b/.test(l)) return l.slice(0, 2);
  if (l && !/^(zxx|und|mul)/.test(l)) return "x";
  return textLang((v.title || "") + " " + (v.desc || "").slice(0, 120));
}
const langOk = v => videoLang(v) !== "x";
async function pool(items, size, fn){
  const out = []; let i = 0;
  await Promise.all(Array.from({ length: Math.min(size, items.length) }, async () => {
    while (i < items.length) { const k = i++; out[k] = await fn(items[k]).catch(e => ({ error: e })); }
  }));
  return out;
}
async function videoDetails(ids){
  const batches = []; for (let i = 0; i < ids.length; i += 50) batches.push(ids.slice(i, i + 50));
  const pages = await pool(batches, 8, b => api("videos", { part: "snippet,contentDetails,statistics,status", id: b.join(",") }));
  const firstErr = pages.find(p => p?.error)?.error; if (firstErr && pages.every(p => p?.error)) throw firstErr;
  return pages.flatMap(p => p?.items || []);
}

const spin = on => $("#btnRefresh").classList.toggle("spin", on);
const errMsg = e => e.reason === "quotaExceeded" ? "Unità giornaliere finite: l'app torna a funzionare dopo le 9:00" : e.message;

const usedToday = () => S.qDay === qDay() ? S.qUsed || 0 : 0;

/* Aggiornamento delle iscrizioni, pensato per consumare poche unità:
   1) channels.list legge quanti video ha ogni canale, 50 canali per unità (460 canali = 10 unità);
   2) si scaricano gli ultimi video solo dei canali il cui numero è cambiato (1 unità ciascuno),
      più un piccolo controllo a rotazione di 4 canali, nel caso il contatore di YouTube sia in ritardo;
   3) si chiedono i dettagli solo dei video mai visti (1 unità ogni 50 video).
   Il primo aggiornamento scarica tutti i canali una volta sola. */
async function refresh(manual, full){
  if (busy) return;
  if (!S.key) { if (manual) { toast("Aggiungi prima la chiave API"); go("vSettings"); } return; }
  if (!S.channels.length) { if (manual) toast("Nessun canale: accedi o aggiungili dalla scheda Canali"); return; }
  busy = true; spin(true);
  const u0 = usedToday(), now = Date.now(), meta = S.chMeta;
  try {
    // 1) quanti video ha ogni canale
    $("#hTitle").textContent = tab === "vSubs" ? "Controllo i canali…" : LABEL(tab);
    const ids = S.channels.map(c => c.id), batches = [], counts = {};
    // i canali che non pubblicano da più di 60 giorni si controllano una volta al giorno
    const last = {}; for (const v of S.videos) if (!last[v.ch] || v.at > last[v.ch]) last[v.ch] = v.at;
    const daily = full || now - (S.inactiveCheck || 0) > 24 * 3600000;
    const active = id => !meta[id] || (last[id] && now - Date.parse(last[id]) < 60 * 864e5);
    const checkIds = daily ? ids : ids.filter(active);
    for (let i = 0; i < checkIds.length; i += 50) batches.push(checkIds.slice(i, i + 50));
    if (daily) S.inactiveCheck = now;
    const pages = await pool(batches, 4, b => api("channels", { part: "statistics", id: b.join(","), maxResults: 50 }));
    const firstErr = pages.find(p => p?.error)?.error;
    if (firstErr && pages.every(p => p?.error)) throw firstErr;
    pages.forEach(p => (p?.items || []).forEach(c => counts[c.id] = +c.statistics?.videoCount || 0));

    // 2) quali canali scaricare
    const newest = {};
    for (const v of S.videos) if (!newest[v.ch] || v.at > newest[v.ch]) newest[v.ch] = v.at;
    const have = new Set(S.videos.map(v => v.ch));
    const changed = S.channels.filter(c => {
      const m = meta[c.id];
      if (!m) return true;
      // i video di questo canale dovrebbero esserci ma non ci sono (memoria persa o salvataggio fallito): li riscarico
      if (!have.has(c.id) && (m.ids || []).some(x => !(m.sk || []).includes(x))) return true;
      if (c.id in counts && counts[c.id] !== m.n) return true;
      return m.up && now - m.at > 6 * 3600000;                 // c'era una première in arrivo
    });
    const inChanged = new Set(changed.map(c => c.id));
    // Il contatore dei video di YouTube a volte si aggiorna in ritardo: per questo ricontrollo direttamente
    // i canali che pubblicano spesso, ogni volta che è passato circa il loro intervallo tipico tra due video.
    const dates = {};
    for (const v of S.videos) (dates[v.ch] || (dates[v.ch] = [])).push(Date.parse(v.at));
    const gap = id => {
      const d = (dates[id] || []).sort((a, b) => b - a);
      if (d.length < 2) return 7 * 864e5;
      const gaps = d.slice(0, 6).map((t, i, a) => i ? a[i - 1] - t : 0).slice(1).sort((a, b) => a - b);
      return Math.min(14 * 864e5, Math.max(2 * 3600000, gaps[Math.floor(gaps.length / 2)]));
    };
    const due = c => (now - meta[c.id].at) / (gap(c.id) || 1);
    const sweep = full ? S.channels.filter(c => !inChanged.has(c.id))
      : S.channels.filter(c => meta[c.id] && !inChanged.has(c.id)).map(c => [due(c), c]).filter(x => x[0] >= 1)
          .sort((a, b) => b[0] - a[0]).slice(0, 5).map(x => x[1]);
    const todo = changed.concat(sweep);
    let done = 0; progress(0, todo.length);
    const res = await pool(todo, 8, ch => channelUploads(ch).finally(() => progress(++done, todo.length)));
    // riprova piano i canali che non hanno risposto (a volte YouTube rifiuta troppe richieste insieme)
    const retry = res.map((r, i) => r?.error && !quotaOut() ? i : -1).filter(i => i >= 0);
    if (retry.length) {
      const again = await pool(retry, 2, i => channelUploads(todo[i]));
      retry.forEach((i, k) => { if (again[k] && !again[k].error) res[i] = again[k]; });
    }
    const fails = res.filter(r => r?.error);
    S.lastFail = fails.length ? { n: fails.length, of: todo.length, msg: errMsg(fails[0].error), at: now } : null;
    if (todo.length && fails.length === todo.length) throw fails[0].error;

    // 3) dettagli solo dei video nuovi (e delle dirette, per sapere se sono finite)
    const known = new Map(S.videos.map(v => [v.id, v]));
    const want = new Set(S.videos.filter(v => v.live).map(v => v.id)), lax = new Set();
    res.forEach((r, i) => {
      if (!r?.ids) return;
      const sk = new Set(full ? [] : meta[todo[i].id]?.sk || []);
      r.ids.forEach(id => { if (!known.has(id) && !sk.has(id)) want.add(id); if (!r.strict) lax.add(id); });
    });
    const det = want.size ? await videoDetails([...want]) : [];
    const fresh = new Map(), skipped = new Set(), upcoming = new Set();
    for (const v of det) {
      if (v.snippet.liveBroadcastContent === "upcoming") { upcoming.add(v.id); continue; }
      if (lax.has(v.id) && looksShort(v, secs(v.contentDetails.duration))) { skipped.add(v.id); continue; }
      fresh.set(v.id, toVideo(v));
    }
    res.forEach((r, i) => {
      if (!r?.ids) return;
      const id = todo[i].id, oldSk = new Set(meta[id]?.sk || []);
      meta[id] = { n: id in counts ? counts[id] : (meta[id]?.n ?? -1), at: now, ids: r.ids,
        sk: r.ids.filter(x => skipped.has(x) || (oldSk.has(x) && !fresh.has(x))),
        up: r.ids.some(x => upcoming.has(x)) ? 1 : 0 };
    });

    // unisci, tieni al massimo "Video per canale" video per iscrizione
    for (const [id, v] of fresh) known.set(id, v);
    const subsSet = new Set(ids), per = {}, keep = [];
    for (const v of [...known.values()].sort((a, b) => b.at.localeCompare(a.at))) {
      if (!subsSet.has(v.ch)) continue;
      per[v.ch] = (per[v.ch] || 0) + 1;
      if (per[v.ch] <= Math.max(5, S.opt.perChannel)) keep.push(v);
    }
    if (!S.seenNotif) S.seenNotif = keep[0] ? Date.parse(keep[0].at) : now;
    S.videos = remember(keep.slice(0, 4000)); S.lastFetch = now; lastError = "";
    S.lastCost = usedToday() - u0; save();
    if (S.lastFail) toast(`${S.lastFail.n} canali su ${S.lastFail.of} non hanno risposto: ${S.lastFail.msg}`);
    else if (firstErr) toast("Alcuni canali non si sono aggiornati: " + errMsg(firstErr));
    else if (manual) toast(`Iscrizioni aggiornate · ${fresh.size} video nuovi · ${S.lastCost} unità`);
    S.lastInfo = { checked: todo.length, fresh: fresh.size };
    // video nuovi dalle iscrizioni: entrano subito anche in Home (gratis), se non la stai scorrendo
    if (fresh.size && S.home.length && (tab !== "vHome" || document.getElementById("main").scrollTop < 40)) setTimeout(() => loadHome(false, true), 0);
  } catch (e) { lastError = errMsg(e); toast(lastError); }
  finally { busy = false; spin(false); progress(0, 0); updateBell(); rerender(); }
}

/* Video popolari per categoria: servono sia alla Home sia ai "Video simili".
   Restano in memoria 3 ore, così aprire video o tornare in Home non costa nulla. */
/* Le classifiche di YouTube hanno fino a 4 pagine da 50 video: ogni aggiornamento manuale della Home passa alla pagina successiva. */
async function chartPage(c, idx, force){
  const key = S.opt.region + ":" + (c || "all"), T = S.chartTok[key] || (S.chartTok[key] = []);
  if (idx && !T[idx]) { try { await chartPage(c, idx - 1, true); } catch {} }   // serve il "segnalibro" della pagina prima
  if (idx && !T[idx]) idx = 0;
  const ck = key + ":" + idx, rc = S.relCache;
  if (!force && rc[ck] && Date.now() - rc[ck].at < 12 * 3600000) return remember(rc[ck].list);
  const j = await api("videos", { part: "snippet,contentDetails,statistics", chart: "mostPopular", regionCode: S.opt.region, maxResults: 50,
    ...(c ? { videoCategoryId: c } : {}), ...(idx ? { pageToken: T[idx] } : {}) });
  if (j.nextPageToken) T[idx + 1] = j.nextPageToken;
  const list = remember((j.items || []).filter(v => v.snippet.liveBroadcastContent !== "upcoming" && !looksShort(v, secs(v.contentDetails.duration))).map(toVideo));
  rc[ck] = { at: Date.now(), list };
  pruneRel();
  save(); return list;
}
const catChart = (c, force) => chartPage(c, 0, force);

/* Ricerca su YouTube: 100 unità, fisse per Google. La stessa ricerca ripetuta entro 24 ore è gratis. */
const searchKey = (q, tag) => S.opt.region + ":" + (tag || "") + q.toLowerCase().trim();
function searchCached(q, tag){ const hit = S.sCache[searchKey(q, tag)]; return hit && Date.now() - hit.at < 24 * 3600000 ? remember(hit.list) : null; }
async function searchVideos(q, max, extra, tag){
  const key = searchKey(q, tag), sc = S.sCache, hit = sc[key];
  if (hit && Date.now() - hit.at < 24 * 3600000) return { list: remember(hit.list), cached: true };
  const j = await api("search", { part: "id", q, type: "video", maxResults: max, regionCode: S.opt.region, safeSearch: "none",
    ...(extra || { relevanceLanguage: "it" }) });
  const ids = (j.items || []).map(i => i.id.videoId).filter(Boolean);
  const det = ids.length ? await videoDetails(ids) : [], order = new Map(ids.map((id, i) => [id, i]));
  const list = remember(det.filter(v => v.snippet.liveBroadcastContent !== "upcoming" && !looksShort(v, secs(v.contentDetails.duration)))
    .sort((a, b) => order.get(a.id) - order.get(b.id)).map(toVideo));
  sc[key] = { at: Date.now(), list, pages: [list.length], next: j.nextPageToken || "", extra: extra || null, max };
  Object.keys(sc).sort((a, b) => sc[b].at - sc[a].at).slice(40).forEach(k => delete sc[k]);
  save(); return { list, cached: false };
}
/* pagina successiva di una ricerca già fatta (100 unità, costo fisso di Google): si aggiunge in coda e resta salvata 24 ore */
async function searchMoreVideos(q, tag){
  const key = searchKey(q, tag), hit = S.sCache[key];
  if (!hit?.next) return null;
  const j = await api("search", { part: "id", q, type: "video", maxResults: hit.max || 50, regionCode: S.opt.region, safeSearch: "none",
    ...(hit.extra || { relevanceLanguage: "it" }), pageToken: hit.next });
  const have = new Set(hit.list.map(v => v.id));
  const ids = (j.items || []).map(i => i.id.videoId).filter(id => id && !have.has(id));
  const det = ids.length ? await videoDetails(ids) : [], order = new Map(ids.map((id, i) => [id, i]));
  const add = remember(det.filter(v => v.snippet.liveBroadcastContent !== "upcoming" && !looksShort(v, secs(v.contentDetails.duration)))
    .sort((a, b) => order.get(a.id) - order.get(b.id)).map(toVideo));
  hit.list = hit.list.concat(add); hit.pages = (hit.pages || [hit.list.length - add.length]).concat(add.length);
  hit.next = j.nextPageToken || ""; save();
  return add;
}

/* Home "Per te": YouTube non dà i consigliati personali via API, quindi li ricostruiamo dai tuoi segnali:
   like su YouTube (peso 3), video guardati in YTG (peso 2), video dei tuoi canali (peso basso).
   Da qui escono le categorie preferite (tendenze per categoria, 1 unità ciascuna)
   e le parole chiave preferite (ricerche recenti, 100 unità ciascuna). */
const CATS = { "1":"Film e animazione","2":"Motori","10":"Musica","15":"Animali","17":"Sport","19":"Viaggi","20":"Videogiochi",
  "22":"Persone e blog","23":"Comicità","24":"Intrattenimento","25":"Notizie","26":"Stile e consigli","27":"Istruzione","28":"Scienza e tecnologia","29":"Attivismo" };
const STOP = new Set(["video","youtube","shorts","short","new","2024","2025","2026","official","ita","italia","italiano","the","and","di","il","la","e"]);
/* Profilo dei gusti: like (+3), video guardati in YTG (+2), video delle iscrizioni (+0,25),
   "Non mi interessa" (canale −6, tag −2, categoria −1). */
function profile(){
  const cat = {}, tag = {}, ch = {}, chNames = new Set(S.channels.map(c => c.title.toLowerCase()));
  const add = (v, w, wc = w) => {
    if (!v) return;
    if (v.cat && CATS[v.cat]) cat[v.cat] = (cat[v.cat] || 0) + wc;
    if (v.ch) ch[v.ch] = (ch[v.ch] || 0) + w;
    for (const t of new Set(v.tags || [])) if (t.length > 2 && t.length < 32 && !STOP.has(t) && !chNames.has(t)) tag[t] = (tag[t] || 0) + w;
  };
  S.likes.forEach(v => add(v, 3)); S.hist.forEach(v => add(v, 2)); S.videos.slice(0, 200).forEach(v => add(v, .25));
  S.nope.forEach(v => { if (v.ch) ch[v.ch] = (ch[v.ch] || 0) - 6; add({ cat: v.cat, tags: v.tags }, -2, -1); });
  return { cat, tag, ch };
}
function interests(){
  const p = profile(), top = o => Object.entries(o).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  return { cats: top(p.cat).slice(0, 3), tags: top(p.tag).filter(t => p.tag[t] >= 2).slice(0, 4), p };
}
/* Temi d'interesse: i tag usati da più canali a cui sei iscritto (ogni canale conta una volta per tag,
   così uno che ripete sempre gli stessi tag non domina), più i like (+3) e i video guardati (+2).
   "Non mi interessa" li abbassa (−4); quelli che togli dai chip non vengono più usati. */
const GENERIC = new Set(["video","videos","vlog","funny","new","nuovo","tutorial","review","recensione","how to","italia","italiano","italian","english",
  "live","diretta","shorts","short","music","musica","gaming","game","games","news","notizie","best","top","viral","trending","challenge","reaction",
  "podcast","youtube","youtuber","2022","2023","2024","2025","2026","the","and","di","il","la","e","official","ufficiale","full","episode","episodio","ita","eng"]);
function topics(){
  const chNames = S.channels.map(c => c.title.toLowerCase()).filter(n => n.length > 2);
  const muted = new Set(S.mutedTopics.map(t => t.toLowerCase()));
  const good = t => t.length > 2 && t.length <= 30 && !GENERIC.has(t) && !STOP.has(t) && !/^[\d\s.:#@-]+$/.test(t) && !/[#@]/.test(t)
    && !muted.has(t) && !chNames.some(n => t === n || t.includes(n) || n.includes(t));
  const chs = {}, score = {};
  for (const v of S.videos) for (const t of v.tags || []) if (good(t)) (chs[t] || (chs[t] = new Set())).add(v.ch);
  for (const t in chs) score[t] = chs[t].size;
  const bump = (list, w) => list.forEach(v => (v.tags || []).forEach(t => { if (good(t)) score[t] = (score[t] || 0) + w; }));
  bump(S.nope, -4);                                           // solo i tag dei creator che segui (più quelli aggiunti a mano)
  const ranked = Object.entries(score).filter(([, s]) => s >= 3).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const out = (S.myTopics || []).filter(t => !muted.has(t.toLowerCase())).slice();
  for (const t of ranked) { if (!out.some(o => o.includes(t) || t.includes(o))) out.push(t); if (out.length >= 10) break; }
  return out;
}

function interleave(lists){
  const out = [], seen = new Set(); let i = 0, more = true;
  while (more) { more = false; for (const l of lists) if (i < l.length) { more = true; const v = l[i]; if (!seen.has(v.id)) { seen.add(v.id); out.push(v); } } i++; }
  return out;
}
/* Canali che guardi o a cui metti like ma a cui non sei iscritto: i loro ultimi video entrano nella Home. */
function favChannels(p){
  return Object.entries(p.ch).filter(([id, w]) => w >= 4 && !isSub(id) && !S.blocked[id]).sort((a, b) => b[1] - a[1]).map(x => x[0]).slice(0, 8);
}
/* Video costruiti dalla playlist stessa: 1 unità invece di 2 (manca solo la durata) */
function fromPlaylistItem(it){
  const s = it.snippet || {}, t = s.thumbnails || {};
  if (!t.default && !t.medium) return null;                       // video privato o eliminato
  return { id: it.contentDetails.videoId, title: s.title, ch: s.videoOwnerChannelId || s.channelId, chTitle: s.videoOwnerChannelTitle || s.channelTitle,
    at: it.contentDetails.videoPublishedAt || s.publishedAt, dur: 0, live: false, views: 0, likes: 0, comments: 0,
    thumb: (t.maxres || t.standard || t.high || t.medium || t.default || {}).url || "", desc: (s.description || "").slice(0, 200), cat: "", tags: [] };
}
async function withDetails(items, dropShorts){
  const need = items.filter(v => !(CACHE.get(v.id)?.dur > 0)).map(v => v.id);
  const det = new Map();
  if (need.length) {
    for (const v of await videoDetails(need)) {
      if (v.snippet.liveBroadcastContent === "upcoming") { det.set(v.id, null); continue; }
      if (dropShorts && looksShort(v, secs(v.contentDetails.duration))) { det.set(v.id, null); continue; }
      det.set(v.id, toVideo(v));
    }
  }
  return remember(items.map(v => det.has(v.id) ? det.get(v.id) : (CACHE.get(v.id)?.dur > 0 ? CACHE.get(v.id) : v)).filter(Boolean));
}
async function channelLatest(id){
  const key = "ch:" + id, rc = S.relCache;
  if (rc[key] && Date.now() - rc[key].at < 24 * 3600000) return remember(rc[key].list);
  const j = await api("playlistItems", { part: "snippet,contentDetails", playlistId: "UULF" + id.slice(2), maxResults: 10 });
  const list = await withDetails((j.items || []).map(fromPlaylistItem).filter(Boolean), false);
  rc[key] = { at: Date.now(), list }; save(); return list;
}
/* Home, come quella di YouTube:
   S) video dei canali a cui sei iscritto che non hai ancora visto (gratis: sono già scaricati), prima i canali che guardi di più e i più recenti;
   P) i video più visti dei tuoi canali che non hai visto, e gli ultimi dei canali che guardi senza esserci iscritto (2 unità per canale, salvati 7 giorni);
   D) pochi video nuovi molto vicini ai tuoi interessi, da canali che escono più volte nelle ricerche sui tuoi temi.
   Ogni 10 video: 5 S, 2 P, 3 D (D si può spegnere nelle impostazioni; se un gruppo finisce, si riempie con gli altri).
   Esclusi: già visti, "Non mi interessa", Non mi piace, canali nascosti, altre lingue (per i canali non seguiti). */
function chAffinity(){
  const a = {};
  S.likes.forEach(v => v.ch && (a[v.ch] = (a[v.ch] || 0) + 3));
  S.hist.forEach(v => v.ch && (a[v.ch] = (a[v.ch] || 0) + 2));
  S.nope.forEach(v => v.ch && (a[v.ch] = (a[v.ch] || 0) - 3));
  return a;
}
const freshOk = v => !S.watched[v.id] && !S.hidden[v.id] && !S.blocked[v.ch];
function subsPool(skip){
  const a = chAffinity(), now = Date.now();
  const pick = d => S.videos.filter(v => freshOk(v) && !skip?.has(v.id) && now - Date.parse(v.at) < d * 864e5);
  let list = pick(30); if (list.length < 60) list = pick(150);
  return list.map(v => {
    const d = (now - Date.parse(v.at)) / 864e5, w = a[v.ch] || 0;
    let s = Math.log2(1 + Math.max(0, w)) * 1.5 + Math.min(0, w) * .5 + (d < 1 ? 4 : d < 3 ? 3 : d < 7 ? 2 : d < 14 ? 1 : 0) - d / 30;
    s += -(S.homeSeen[v.id] || 0) * .7 + Math.random() * 1.2;
    return [s, v];
  }).sort((x, y) => y[0] - x[0]).map(x => x[1]);
}
/* i video più visti di un canale (playlist "popolari" di YouTube), senza Shorts */
async function channelPopular(id){
  const key = "pop:" + id, rc = S.relCache;
  if (rc[key] && Date.now() - rc[key].at < 7 * 864e5) return remember(rc[key].list);
  let list = [];
  try {
    const j = await api("playlistItems", { part: "snippet,contentDetails", playlistId: "UULP" + id.slice(2), maxResults: 12 });
    list = await withDetails((j.items || []).map(fromPlaylistItem).filter(Boolean), true);
  } catch (e) { if (e.reason === "quotaExceeded") throw e; }
  rc[key] = { at: Date.now(), list }; save(); return list;
}
/* canali per i "più visti": prima quelli che guardi di più */
function popChannels(){
  const a = chAffinity();
  return S.channels.map(c => c.id).filter(id => !S.blocked[id] && (a[id] || 0) >= 0)
    .sort((x, y) => (a[y] || 0) - (a[x] || 0) || x.localeCompare(y));
}
async function fetchPopular(n){
  const todo = popChannels().filter(id => !(S.relCache["pop:" + id] && Date.now() - S.relCache["pop:" + id].at < 7 * 864e5)).slice(0, n);
  await Promise.all(todo.map(id => channelPopular(id).catch(() => [])));
}
function popPool(p, skip){
  const a = chAffinity(), out = [];
  for (const id of popChannels()) { const c = S.relCache["pop:" + id]; if (c) c.list.forEach(v => out.push(v)); }
  for (const id of favChannels(p)) { const c = S.relCache["ch:" + id]; if (c) c.list.forEach(v => langOk(v) && out.push(v)); }
  const seen = new Set();
  return remember(out.filter(v => freshOk(v) && !isKids(v) && !skip?.has(v.id) && !seen.has(v.id) && seen.add(v.id))).map(v => {
    let s = Math.log2(1 + Math.max(0, a[v.ch] || 0)) * 1.5 + Math.log10(1 + (v.views || 0)) * .3;
    s += -(S.homeSeen[v.id] || 0) * .7 + Math.random() * 1.5;
    return [s, v];
  }).sort((x, y) => y[0] - x[0]).map(x => x[1]);
}
function pruneRel(){ const rc = S.relCache; for (const k of Object.keys(rc)) if (Date.now() - rc[k].at > (k.startsWith("pop:") ? 8 * 864e5 : 48 * 3600000)) delete rc[k]; }
const DISC_MIN = 6;                      // pertinenza minima per un video da un canale che non segui
function mixHome(pools, max){
  const pat = S.opt.homeDisc === false ? "SSPSSSSPSS" : "SDSPSDSPSD", have = new Set(S.home.map(v => v.id)), total = {};
  const L = { S: (pools.S || []).slice(), P: (pools.P || []).slice(), D: (pools.D || []).slice() };
  S.home.forEach(v => total[v.ch] = (total[v.ch] || 0) + 1);
  const cap = v => isSub(v.ch) ? 99 : 3;                                   // canali che non segui: massimo 3 video
  const spaced = v => { const w = S.home.slice(-10); return w[w.length - 1]?.ch !== v.ch && w.filter(x => x.ch === v.ch).length < 2; };
  const next = (k, relaxed) => {
    const l = L[k];
    for (let j = 0; j < l.length; j++) {
      const v = l[j];
      if (have.has(v.id) || (total[v.ch] || 0) >= cap(v)) { l.splice(j--, 1); continue; }
      if (relaxed || spaced(v)) { l.splice(j, 1); return v; }
    }
    return null;
  };
  let i = S.home.length, added = 0;
  while (S.home.length < max) {
    let v = next(pat[i % pat.length]);
    if (!v) for (const k of "SPD") if ((v = next(k))) break;
    if (!v) for (const k of "SPD") if ((v = next(k, true))) break;
    if (!v) break;
    total[v.ch] = (total[v.ch] || 0) + 1; have.add(v.id); S.home.push(v); added++; i++;
  }
  remember(S.home); return added;
}
async function loadHome(manual, noFetch, auto){
  if (homeBusy || !S.key) return;
  homeBusy = true; spin(true); rerender();
  const u0 = usedToday();
  try {
    const { cats, p } = interests();
    const T = S.opt.homeSearch ? topics() : [];
    // D) ricerche sui tuoi temi: al massimo una nuova (100 unità) a ogni aggiornamento manuale, le altre di oggi si riusano gratis
    const lists = [];
    if (T.length) {
      const n = T.length; let k = S.homePage._t || 0;
      if (manual || auto) k = (k + 1) % n; S.homePage._t = k;
      const since = new Date(Date.now() - 90 * 864e5); since.setUTCHours(0, 0, 0, 0);
      const extra = { publishedAfter: since.toISOString(), order: "relevance" };
      let fetched = 0;
      for (const t of [T[k], T[(k + 1) % n]]) {
        if (searchCached(t, "h:")) continue;
        if (noFetch || fetched >= 1 || quotaOut() || (auto && T.some(x => searchCached(x, "h:")))) continue;
        try { await searchVideos(t, 50, { ...extra, relevanceLanguage: topicLang(t) }, "h:"); fetched++; } catch (e) { if (e.reason === "quotaExceeded") break; }
      }
      for (const t of T) { const c = searchCached(t, "h:"); if (c) lists.push(c.map((v, i) => [v, 3 - i / 20])); }
      S.homeMode = "foryou"; S.homeTags = T.slice(0, 8);
    }
    if (!noFetch && !quotaOut()) {
      // P) più visti di altri 4 tuoi canali (2 in automatico) + ultimi video di 2 canali che guardi senza essere iscritto
      await fetchPopular(auto ? 2 : 4);
      const favs = favChannels(p), pick = favs.length ? [0, 1].map(j => favs[((S.homePage._f || 0) + j) % favs.length]) : [];
      if (manual) S.homePage._f = (S.homePage._f || 0) + 2;
      // D) ultimi video di 3 canali scoperti
      const disc = discoveryChannels(p, T).slice(0, 5);
      await Promise.all([...new Set(pick.concat(disc))].map(id => channelLatest(id).catch(() => [])));
    }
    for (const id of discoveryChannels(p, T)) { const c = S.relCache["ch:" + id]; if (c) lists.push(c.list.map(v => [v, 1.5])); }
    const pools = { S: subsPool(), P: popPool(p), D: S.opt.homeDisc === false ? [] : rankHome(lists, p, null, DISC_MIN) };
    if (!pools.S.length && !pools.P.length && !pools.D.length) {   // nessuna iscrizione né tema: classifiche, come all'inizio
      const cs = cats.length ? cats : [""], ch = [];
      for (const l of await Promise.all(cs.map(c => chartPage(c, S.homePage[c || "all"] || 0, false).catch(() => [])))) ch.push(l.map(v => [v, 0]));
      pools.D = rankHome(ch, p); S.homeMode = T.length || cats.length ? "foryou" : "trend"; if (!T.length) S.homeTags = cats.map(c => CATS[c]);

function homeOk(v, p){ return !S.watched[v.id] && !S.blocked[v.ch] && !S.hidden[v.id] && !isSub(v.ch) && (p.ch[v.ch] || 0) >= 0 && langOk(v); }
let vocabCache = null, vocabKey = "";
function interestVocab(){
  const key = S.videos.length + ":" + S.likes.length + ":" + S.hist.length + ":" + S.nope.length + ":" + (S.myTopics || []).join("|") + ":" + S.mutedTopics.length;
  if (vocabCache && vocabKey === key) return vocabCache;
  const per = new Map(), w = new Map();
  const ok = x => x.length > 2 && !STOPW.has(x) && !GENERIC.has(x) && !/^\d+$/.test(x);
  const split = v => { const s = new Set(); for (const x of words(v)) { if (x.includes(" ")) x.split(/\s+/).forEach(y => ok(y) && s.add(y)); if (ok(x)) s.add(x); } return s; };
  for (const v of S.videos) for (const x of split(v)) (per.get(x) || per.set(x, new Set()).get(x)).add(v.ch);
  for (const [x, chs] of per) if (chs.size >= 2) w.set(x, Math.log2(1 + chs.size));
  const add = (list, k) => list.forEach(v => split({ title: v.title || "", tags: v.tags || [] }).forEach(x => w.set(x, (w.get(x) || 0) + k)));
  add(S.likes, 2); add(S.hist.map(h => ({ tags: h.tags })), 1.5); add(S.nope, -2);
  for (const t of S.myTopics || []) split({ title: t, tags: [t] }).forEach(x => w.set(x, (w.get(x) || 0) + 6));
  for (const t of S.mutedTopics) split({ title: t, tags: [t] }).forEach(x => w.set(x, -4));

function subTags(){
  const key = S.videos.length + ":" + (S.videos[0]?.id || "") + ":" + (S.myTopics || []).join("|") + ":" + S.mutedTopics.join("|");
  if (subTagCache && subTagKey === key) return subTagCache;
  const chNames = S.channels.map(c => c.title.toLowerCase()).filter(n => n.length > 2), muted = new Set(S.mutedTopics.map(t => t.toLowerCase()));
  const good = t => t.length > 2 && t.length <= 30 && !GENERIC.has(t) && !STOP.has(t) && !/^[\d\s.:#@-]+$/.test(t) && !muted.has(t) && !chNames.some(n => t === n || t.includes(n) || n.includes(t));
  const per = new Map();
  for (const v of S.videos) for (const t of v.tags || []) { const k = normTxt(t); if (good(k)) (per.get(k) || per.set(k, new Set()).get(k)).add(v.ch); }
  const m = new Map(); for (const [t, chs] of per) if (chs.size >= 2) m.set(t, chs.size);

function tagScore(v){

  for (const [t, n] of T) if (!seen.has(t) && t.length > 3 && title.includes(" " + t.replace(/[^a-z0-9]+/g, " ") + " ")) { seen.add(t); sc += n >= 3 ? 2 : 1; }

}
const KIDS_RE = /\b(for kids|kids songs?|per bambini|bambini|nursery|filastrocc\w*|cartoni animati|cartoon|cocomelon|peppa|baby shark|toddlers?|preschool|canzoncin\w*|bluey|paw patrol|learn colou?rs)\b/i;

function rankHome(lists, p, skip, min){
  const w = interestVocab(), strict = min ? w.size > 0 : w.size > 30, need = min || REL_MIN;
  const now = Date.now(), best = new Map();
  for (const l of lists) for (const [v, base] of l) {
    if (!homeOk(v, p) || skip?.has(v.id) || isKids(v)) continue;
    const rel = relevance(v, w);
    if (min) { if (tagScore(v) < TAG_MIN) continue; }          // canali che non segui: devono avere i tag dei tuoi creator
    else if (strict && rel < need) continue;                   // fuori dai tuoi interessi: non entra
    let s = base + Math.min(rel, 15) * .5 + (p.ch[v.ch] || 0) * 1.2 + (p.cat[v.cat] || 0) * .15;
    for (const t of v.tags || []) s += Math.max(-4, Math.min(4, p.tag[t] || 0)) * .6;

function topicLang(t){

  for (const v of S.videos) {

function discoveryChannels(p, T){

function localSearch(q){

let sRange = "", sRangeYT = "";

function rankSearch(list, q){
  const ws = [...new Set(normTxt(q).replace(/[^a-z0-9 ]+/g, " ").split(/\s+/).filter(w => w.length > 1 && !STOPW.has(w)))];
  const need = ws.length ? Math.max(1, Math.ceil(ws.length * .5)) : 0, since = sRange ? Date.parse(rangeFrom(sRange)) : 0;

function fmtDur(s){
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0");
}
function ago(iso){
  const s = (Date.now() - new Date(iso)) / 1000;
  const u = [[31536000,"anno","anni"],[2592000,"mese","mesi"],[604800,"settimana","settimane"],[86400,"giorno","giorni"],[3600,"ora","ore"],[60,"minuto","minuti"]];
  for (const [n, a, b] of u) if (s >= n) { const k = Math.floor(s/n); return k + " " + (k === 1 ? a : b) + " fa"; }
  return "adesso";
}
function views(n){
  if (!n) return "";
  if (n >= 1e9) return (n/1e9).toFixed(1).replace(".0","").replace(".",",") + " Mrd di visualizzazioni";
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(".0","").replace(".",",") + " Mln di visualizzazioni";
  if (n >= 1e3) return Math.round(n/1e3) + "K visualizzazioni";
  return n + " visualizzazioni";
}
function bucket(iso){
  const d = new Date(iso), now = new Date(), day = 864e5;
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if (d >= start) return "Oggi";
  if (d >= start - day) return "Ieri";
  if (d >= start - 6*day) return "Questa settimana";
  if (d >= start - 30*day) return "Questo mese";
  return "Più vecchi";
}

const BK_SKIP = new Set(["token", "tokenExp", "tokenScope", "silentFail", "sCache", "relCache", "home", "homeFetch", "homeMode", "meData", "qDay", "qUsed", "quotaOut", "lastFail", "lastBackup"]);
function exportBackup(){
  const data = {}; for (const k in S) if (!BK_SKIP.has(k)) data[k] = S[k];
  const now = new Date(), name = `YTG-backup-${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}.json`;
  const file = new File([JSON.stringify({ app: "YTG", ver: 1, at: now.toISOString(), data })], name, { type: "application/json" });
  const done = () => { S.lastBackup = Date.now(); save(); renderSettings(); };
  if (navigator.canShare?.({ files: [file] })) {          // su iPhone: foglio di condivisione → "Salva su File"
    navigator.share({ files: [file], title: name }).then(done, e => { if (e?.name !== "AbortError") toast("Esportazione non riuscita"); });
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  done();
}

  if (!confirm(`Ripristinare il backup${when ? " del " + when : ""}? I dati di YTG su questo telefono verranno sostituiti.`)) return;

/* ---------- notifiche: commenti ----------

   2) risposte ai commenti che hai scritto da YTG (commentThreads per id, fino a 50 in 1 unità).
   YouTube non permette di elencare i commenti scritti altrove, quindi le risposte arrivano solo per quelli scritti qui.

let nBusy = false;
function followThread(threadId, videoId){
  if (!threadId) return false;
  const list = S.myComments || (S.myComments = []);
  if (list.some(c => c.id === threadId)) return false;
  list.unshift({ id: threadId, v: videoId || "", at: new Date().toISOString() });
  S.myComments = list.slice(0, 50); save(); return true;
}
/* Link di un commento copiato dall'app di YouTube: ...watch?v=VIDEO&lc=ID_COMMENTO (o ID_DISCUSSIONE.ID_RISPOSTA) */
function parseCommentLink(s){
  const lc = (s.match(/[?&]lc=([\w-]+)(?:\.[\w-]+)?/) || [])[1] || (/^Ug[\w-]{10,}$/.test(s.trim()) ? s.trim() : "");
  const v = (s.match(/(?:[?&]v=|youtu\.be\/|shorts\/)([\w-]{11})/) || [])[1] || "";
  return lc ? { lc, v } : null;
}
const newNotifs = () => (S.notifs || []).filter(n => Date.parse(n.at) > S.seenNotif);

async function myChannelId(){

  const j = await apiAuth("channels", { part: "id", mine: "true" });

}
async function loadNotifs(force){
  if (nBusy || !S.key || quotaOut()) return;
  if (!force && Date.now() - (S.nFetch || 0) < 3 * 3600000) return;
  nBusy = true;
  try {
    const me = await myChannelId().catch(() => "");
    const mine = (S.myComments || []).slice(0, 50);
    if (!me && !mine.length) return;
    const out = [];
    const [onMine, threads] = await Promise.all([
      me ? api("commentThreads", { part: "snippet", allThreadsRelatedToChannelId: me, maxResults: 25, order: "time", textFormat: "plainText" }).catch(() => ({})) : {},
      mine.length ? api("commentThreads", { part: "snippet,replies", id: mine.map(c => c.id).join(","), textFormat: "plainText", maxResults: 50 }).catch(() => ({})) : {}
    ]);
    for (const t of onMine.items || []) {
      const c = t.snippet.topLevelComment.snippet;
      if (c.authorChannelId?.value === me) continue;
      out.push({ k: "c", id: t.id, tid: t.id, who: c.authorDisplayName, pic: c.authorProfileImageUrl, text: c.textOriginal ?? c.textDisplay, at: c.publishedAt, v: t.snippet.videoId });
    }
    for (const t of threads.items || []) {
      for (const r of t.replies?.comments || []) {
        const c = r.snippet;
        if (me && c.authorChannelId?.value === me) continue;
        out.push({ k: "r", id: r.id, tid: t.id, who: c.authorDisplayName, pic: c.authorProfileImageUrl, text: c.textOriginal ?? c.textDisplay, at: c.publishedAt, v: t.snippet.videoId });
      }
    }
    out.sort((a, b) => b.at.localeCompare(a.at));
    const need = [...new Set(out.map(n => n.v))].filter(id => !CACHE.has(id)).slice(0, 50);
    if (need.length) { try { (await videoDetails(need)).forEach(v => CACHE.set(v.id, toVideo(v))); } catch {} }
    S.notifs = out.slice(0, 40).map(n => ({ ...n, vt: CACHE.get(n.v)?.title || "un video", th: CACHE.get(n.v)?.thumb || "" }));
    S.nVids = S.notifs.map(n => CACHE.get(n.v)).filter(Boolean).filter((v, i, a) => a.findIndex(x => x.id === v.id) === i);
    S.nFetch = Date.now(); save();
  } finally { nBusy = false; updateBell(); if ($("#notifs").classList.contains("open")) renderNotifs(); }
}

/* ---------- statistiche: secondi guardati per giorno e per canale (ultimi 90 giorni) ---------- */
const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function countWatch(sec){
  if (document.hidden || !ypId) return;
  const v = CACHE.get(ypId) || current; if (!v) return;
  const k = dayKey(), D = S.stats.days, d = D[k] || (D[k] = { s: 0, ch: {} });
  d.s += sec; d.ch[v.ch] = (d.ch[v.ch] || 0) + sec; S.stats.names[v.ch] = v.chTitle;
  const keys = Object.keys(D).sort(); if (keys.length > 90) keys.slice(0, keys.length - 90).forEach(x => delete D[x]);
}
const fmtTime = s => { const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? `${h} h ${m} min` : `${m} min`; };
function statsHTML(){
  const D = S.stats.days, sumDays = (from, n) => { let t = 0; for (let i = 0; i < n; i++) { const d = new Date(from); d.setDate(d.getDate() - i); t += D[dayKey(d)]?.s || 0; } return t; };
  const now = new Date(), wk = sumDays(now, 7), prev = (() => { const d = new Date(now); d.setDate(d.getDate() - 7); return sumDays(d, 7); })();
  if (!wk && !prev && !Object.keys(D).length) return "";
  const opened = Object.values(S.watched).filter(t => t > Date.now() - 7 * 864e5).length;
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(now); d.setDate(d.getDate() - 6 + i); return { l: "DLMMGVS"[d.getDay()], s: D[dayKey(d)]?.s || 0, today: i === 6 }; });
  const max = Math.max(...days.map(d => d.s), 60);
  const ch = {}; for (let i = 0; i < 30; i++) { const d = new Date(now); d.setDate(d.getDate() - i); for (const [c, s] of Object.entries(D[dayKey(d)]?.ch || {})) ch[c] = (ch[c] || 0) + s; }
  const top = Object.entries(ch).sort((a, b) => b[1] - a[1]).slice(0, 5), topMax = top[0]?.[1] || 1;
  const diff = prev ? Math.round((wk - prev) / prev * 100) : null;
  return `<div class="shead"><h3>Statistiche</h3><span class="sub">tempo guardato in YTG</span></div>
    <div class="panel stats" style="margin:0 16px 8px;padding:14px">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><b style="font-size:24px">${fmtTime(wk)}</b><span class="sub">ultimi 7 giorni · ${opened} video aperti${diff !== null ? ` · ${diff >= 0 ? "+" : ""}${diff}% rispetto ai 7 giorni prima` : ""}</span></div>
      <div class="sbars">${days.map(d => `<div class="sbar${d.today ? " today" : ""}"><i style="height:${Math.max(2, d.s / max * 100)}%"></i><span>${d.l}</span></div>`).join("")}</div>
      ${top.length ? `<div class="sub" style="margin:14px 0 6px">Canali più guardati (30 giorni)</div>${top.map(([c, s]) => `<button class="stch" data-ch="${c}"><img src="${esc(avatarOf(c, S.stats.names[c] || ""))}" alt=""><span class="n">${esc(S.stats.names[c] || "")}</span><span class="b"><i style="width:${s / topMax * 100}%"></i></span><span class="t">${fmtTime(s)}</span></button>`).join("")}` : ""}
    </div>`;
}

function ctl(a){

function fitApp(){
  const root = document.documentElement, vv = window.visualViewport;
  const portrait = matchMedia("(orientation: portrait)").matches;
  const scr = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
  const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  const typing = document.activeElement?.matches?.("input,textarea");
  let hgt = Math.max(innerHeight, vv ? Math.round(vv.height) : 0);
  if (standalone && !typing && scr > hgt && scr - hgt < 200) hgt = scr;
  root.style.setProperty("--appH", hgt + "px");
}

/* Gesto "indietro" come nelle app iPhone: dal bordo sinistro trascina verso destra.
   La pagina segue il dito; se la lasci oltre un terzo dello schermo (o con un colpo veloce) si chiude e torni dove eri. */
(() => {
  const edge = $("#edge");
  let sh = null, x0 = 0, y0 = 0, t0 = 0, dx = 0, mode = "";
  const topSheet = () => [...document.querySelectorAll(".sheet.open")].sort((a, b) => (+b.style.zIndex || 0) - (+a.style.zIndex || 0))[0];
  edge.addEventListener("touchstart", e => {
    sh = topSheet(); if (!sh || e.touches.length > 1) { sh = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); dx = 0; mode = "";
  }, { passive: true });
  edge.addEventListener("touchmove", e => {
    if (!sh) return;
    e.preventDefault();
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    if (!mode) {
      if (Math.abs(y - y0) > 10 && Math.abs(y - y0) > Math.abs(x - x0)) mode = "v";
      else if (x - x0 > 8) { mode = "h"; sh.classList.add("dragging"); sh.style.transition = "none"; }
    }
    if (mode === "h") { dx = Math.max(0, x - x0); sh.style.transform = `translateX(${dx}px)`; }
    else if (mode === "v") { sh.scrollTop -= y - y0; y0 = y; }                  // dal bordo si può anche scorrere
  }, { passive: false });
  const end = e => {
    if (!sh) return;
    const s = sh; sh = null;
    if (mode !== "h") {
      if (!mode && e.changedTouches?.[0]) {                                     // semplice tocco sul bordo: lo passo a ciò che c'è sotto
        const t = e.changedTouches[0];
        document.elementsFromPoint(t.clientX, t.clientY).find(el => el !== edge && el.tagName !== "IFRAME")?.click();
      }
      return;
    }
    const w = innerWidth, fast = dx / Math.max(1, Date.now() - t0) > .5;
    const close = dx > w / 3 || (fast && dx > 40);
    s.style.transition = "transform .22s ease";
    s.style.transform = close ? "translateX(100%)" : "translateX(0)";
    setTimeout(() => {
      s.classList.remove("dragging");
      if (close) { s.style.transition = "none"; closeSheet("#" + s.id); s.style.transform = ""; void s.offsetWidth; }
      else s.style.transform = "";
      s.style.transition = "";
    }, 230);
  };
  edge.addEventListener("touchend", end);
  edge.addEventListener("touchcancel", end);
})();

/* ---------- anteprima automatica, come su YouTube ----------
   Quando smetti di scorrere, il primo video che resta per intero sullo schermo parte muto nella miniatura
   (da circa il 10% del video, per saltare le intro). Si ferma quando esce dallo schermo, cambiando scheda
   o aprendo un video; toccandolo si apre dallo stesso punto. Non costa unità. */
const PV = { resume: {}, id: "", el: null, yp: null, t0: 0, start: 0, timer: 0, fired: false, x: 0, y: 0, obs: null, bar: 0 };
const pvTime = () => { try { return PV.yp?.getCurrentTime?.() || PV.start; } catch { return PV.start; } };
function stopPreview(){
  if (PV.id && PV.yp) PV.resume[PV.id] = pvTime();                    // tornandoci sopra riprende da lì
  clearInterval(PV.bar); PV.obs?.disconnect();
  try { PV.yp?.destroy(); } catch {}
  PV.el?.querySelector(".prev")?.remove();
  Object.assign(PV, { id: "", el: null, yp: null, obs: null });
}

async function startPreview(card, id){
  stopPreview();
  const x = CACHE.get(id), th = card.querySelector(".thumb"); if (!x || !th) return;
  PV.id = id; PV.el = th; PV.start = Math.floor(PV.resume[id] || (x.dur > 120 ? x.dur * .1 : 0));
  th.insertAdjacentHTML("beforeend", `<div class="prev"><div id="pvp"></div><div class="pbar"></div>
    <span class="pvol" role="button" data-act="pvVol" aria-label="Audio">${CI.mute}</span></div>`);
  PV.obs = new IntersectionObserver(es => { if (es[0] && es[0].intersectionRatio < .5) stopPreview(); }, { threshold: [0, .5] });
  PV.obs.observe(th);
  const YT = await loadYTApi(); if (PV.id !== id) return;
  PV.yp = new YT.Player("pvp", { width: "100%", height: "100%", videoId: id, host: "https://www.youtube-nocookie.com",
    playerVars: { autoplay: 1, mute: 1, controls: 0, playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, fs: 0, disablekb: 1, start: PV.start },
    events: { onReady: e => { if (PV.id !== id) return; e.target.mute(); e.target.playVideo(); },
      onStateChange: e => {
        if (PV.id !== id) return;
        if (e.data === 0) return stopPreview();
        // la miniatura resta finché il video sta davvero andando: niente schermo nero, rotellina o pulsante play
        if (e.data === 1) setTimeout(() => { if (PV.id === id) th.querySelector(".prev")?.classList.add("live"); }, 350);
      } } });
  PV.bar = setInterval(() => {
    if (PV.id !== id || !PV.yp?.getDuration) return;
    const d = PV.yp.getDuration() || x.dur || 0, b = th.querySelector(".pbar");
    if (b && d) b.style.width = Math.min(100, pvTime() / d * 100) + "%";
  }, 400);
}
function pvVol(){
  const y = PV.yp; if (!y?.isMuted) return;
  if (y.isMuted()) { y.unMute(); y.setVolume(100); } else y.mute();
  const b = PV.el?.querySelector(".pvol"); if (b) b.innerHTML = y.isMuted() ? CI.mute : CI.vol;

function pvCandidate(){
  const main = document.getElementById("main"), view = document.getElementById(tab) || main, r = main.getBoundingClientRect();
  for (const th of view.querySelectorAll(".card .thumb")) {
    const b = th.getBoundingClientRect();
    if (b.bottom <= r.top || b.top >= r.bottom) continue;
    const vis = (Math.min(b.bottom, r.bottom) - Math.max(b.top, r.top)) / b.height;
    if (vis >= .9) return th.closest("[data-v]");
  }
  return null;
}

/* ---------- capitoli ----------
   Dalla descrizione completa (1 unità, una volta sola per video: poi restano salvati).
   Valgono come capitoli almeno 3 orari in ordine crescente, il primo all'inizio del video, come fa YouTube. */
function parseChapters(text){
  const all = [];
  for (const line of String(text || "").split(/\r?\n/)) {
    const m = line.match(/(?:^|[\s(\[])((?:(\d{1,2}):)?(\d{1,2}):(\d{2}))(?=[\s)\]\-–—:|.,]|$)/);
    if (!m) continue;
    const t = (+(m[2] || 0)) * 3600 + (+m[3]) * 60 + (+m[4]);
    let name = line.replace(m[1], "").replace(/^[\s\-–—:|.)\]•·*>]+/, "").replace(/[\s\-–—:|(\[•·*]+$/, "").trim();
    all.push([t, (name || "Capitolo").slice(0, 80)]);
  }
  const i0 = all.findIndex(c => c[0] <= 10); if (i0 < 0) return [];
  const out = [all[i0]];
  for (let i = i0 + 1; i < all.length && all[i][0] > out[out.length - 1][0]; i++) out.push(all[i]);
  return out.length >= 3 ? out : [];
}
let chapNow = -1;

  if (!el || current?.id !== id) return;
  el.innerHTML = ch?.length ? `<div class="group" style="padding-top:2px">Capitoli</div><div class="chaps" id="chapRow">${ch.map(([t, n], i) =>

  const b = row.querySelector(`[data-ci="${i}"]`); if (b) row.scrollTo({ left: b.offsetLeft - 16, behavior: "smooth" });
}
