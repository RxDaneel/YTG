<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YTG</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="YTG">
<meta name="theme-color" content="#1a1a19">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=2">
<link rel="shortcut icon" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* App a colonna singola: barra in alto, contenuto, tab bar fissata al fondo. Palette calda in stile Claude. */
:root{
  --bg:#f3f1ea; --surface:#e9e6dc; --raised:#dfdbcf; --line:#d6d1c4;
  --fg:#141413; --muted:#65635c; --accent:#3b3b38; --on-accent:#f5f4ef; --danger:#c43c3c;
  --glass:rgba(243,241,234,.92);
  --font:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --serif:var(--font);
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --nav-h:58px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1a19; --surface:#242422; --raised:#2e2e2b; --line:#353532;
  --fg:#f5f4ef; --muted:#9c9a92; --accent:#d9d7d1; --on-accent:#1a1a19; --danger:#e06060;
  --glass:rgba(26,26,25,.92); color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:hidden;background:var(--bg);color:var(--fg);font:15px/1.4 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
a{color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--glass);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:calc(var(--top) + 6px) 8px 6px 16px;
  display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line)}
header h1{font:700 22px/1.2 var(--serif);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:9px}
.logo{border:0;background:none;padding:2px 4px 2px 0;font:900 24px/1 var(--font);letter-spacing:-.04em;color:var(--fg);flex:none}
.logo:active{opacity:.6}
#hTitle{font-size:14px;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--fg);text-decoration:none}
.icon-btn:active{background:var(--raised)}
.icon-btn.on{background:var(--raised)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding:calc(var(--top) + 62px) 0 calc(var(--bot) + var(--nav-h) + 16px)}
.view{max-width:760px;margin:0 auto}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--glass);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding-bottom:var(--bot);transform:translateZ(0)}
nav button{flex:1;height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="true"]{color:var(--fg);font-weight:600}
nav button[aria-current="true"] svg{stroke:var(--fg);stroke-width:2.3}

.searchbar{display:flex;gap:8px;padding:12px 16px 4px}
.searchbar input{flex:1;min-width:0;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none}
.searchbar input:focus{border-color:var(--accent)}

.group{padding:18px 16px 8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{display:block;width:100%;text-align:left;border:0;background:none;padding:0 0 20px}
.thumb{position:relative;aspect-ratio:16/9;background:var(--surface);overflow:hidden;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(20,20,19,.82);color:#faf9f5;font-size:12px;font-weight:600;padding:2px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.live{background:var(--danger)}
.seen .thumb::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}
.seen .thumb img{opacity:.55}
.meta{display:flex;gap:12px;padding:10px 16px 0}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;background:var(--raised);object-fit:cover}
.meta>div{min-width:0}
.title{font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{color:var(--muted);font-size:13px;margin-top:3px}

.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty h2{color:var(--fg);font:700 21px/1.25 var(--serif);margin:0 0 8px}
.btn{border:0;border-radius:10px;padding:10px 18px;background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none;display:inline-block}
.btn.ghost{background:var(--raised);color:var(--fg)}
.btn:disabled{opacity:.5}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}

.section{padding:16px}
.section h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 10px;font-weight:600}
.panel{background:var(--surface);border-radius:14px;overflow:hidden}
.field{display:flex;gap:8px;padding:12px}
.field input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);outline:none}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .x{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 8px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.toggle small{display:block;color:var(--muted);font-size:12px}
.switch{appearance:none;-webkit-appearance:none;width:48px;height:29px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(19px)}
select.pick{background:var(--raised);border:0;border-radius:8px;padding:6px 8px}
.help{color:var(--muted);font-size:13px;line-height:1.55;padding:0 4px}
.help ol{padding-left:20px;margin:8px 0}
.help code{background:var(--raised);padding:1px 4px;border-radius:4px;font-size:12px;word-break:break-all}
.status{font-size:12.5px;color:var(--muted);padding:6px 4px}
.status.err{color:var(--danger)}

.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;
  padding-top:var(--top);padding-bottom:calc(var(--bot) + 24px);transform:translateY(100%);transition:transform .28s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.pbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--bg)}
.pbar h3{flex:1;margin:0;font:700 19px var(--serif)}
.frame{aspect-ratio:16/9;background:#000;width:100%;max-width:100%}
.frame iframe{width:100%;height:100%;border:0;display:block}
.pinfo{padding:14px 16px;max-width:100%;overflow:hidden}
.pinfo>*{min-width:0;max-width:100%}
.pinfo h2{font:700 20px/1.3 var(--serif);margin:0 0 8px;text-wrap:balance}
.chan{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px}
.chan .avatar{width:28px;height:28px}
#pInfo>.sub{font-size:12px}
.desc{white-space:pre-wrap;color:var(--muted);font-size:12.5px;line-height:1.45;background:var(--surface);border-radius:10px;padding:10px 12px;max-height:4.6em;overflow:hidden;overflow-wrap:anywhere}
.desc.full{max-height:none}
.more{border:0;background:none;color:var(--fg);padding:6px 0;font-size:12.5px;font-weight:600}

.vt{font:700 18px/1.3 var(--font);margin:0;text-wrap:pretty;overflow-wrap:anywhere}
.vmeta{min-width:0;overflow-wrap:anywhere;font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.vmeta b{color:var(--fg);font-weight:500}
.vmeta .more{padding:0;font-size:12.5px;color:var(--fg)}
.vact{display:flex;align-items:center;gap:4px;margin:14px 0;min-width:0}
.vact .pill{margin-left:6px}
.vact .avatar{width:36px;height:36px}
.pill{border:0;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:500;background:var(--fg);color:var(--bg);flex:none}
.pill.on{background:var(--raised);color:var(--fg)}
.vact .sp{flex:1;min-width:0}
.rbtn{width:38px;height:38px;border:0;border-radius:50%;background:none;display:grid;place-items:center;color:var(--fg);flex:none}
.rbtn:active{background:var(--raised)}
.rbtn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rbtn.on svg{fill:currentColor;stroke:var(--bg)}
.vdesc{background:var(--surface);border-radius:12px;padding:12px;font-size:13px;margin-bottom:12px}
.vdesc .d{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px;line-height:1.45}
.ccard{display:block;width:100%;max-width:100%;overflow:hidden;text-align:left;border:0;background:var(--surface);border-radius:12px;padding:12px;margin-bottom:6px}
.ccard .h{font-size:14px;font-weight:500}
.ccard .h span{color:var(--muted);font-weight:400;margin-left:6px}
.ccard .pv{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px}
.ccard .pv img{width:24px;height:24px;border-radius:50%;flex:none;background:var(--raised)}
.ccard .pv div{min-width:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#player .card .meta,#player .group{padding-left:0;padding-right:0}
.menu{position:fixed;left:8px;right:8px;bottom:calc(var(--bot) + 8px);z-index:200;background:var(--surface);border-radius:16px;padding:6px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:13px 14px;border-radius:10px;font-size:15px}
.menu button:active{background:var(--raised)}
.scrim{position:fixed;inset:0;z-index:199;background:rgba(0,0,0,.35)}
.comments h3{font:700 15px var(--serif);margin:16px 0 10px}
.cform{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
.cform .btn{padding:8px 14px;font-size:13px}
.cform textarea{flex:1;min-width:0;resize:none;min-height:36px;max-height:120px;padding:8px 11px;font-size:13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);outline:none}
.cform textarea:focus{border-color:var(--accent)}
.cmt{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--line)}
.cmt .avatar{width:24px;height:24px}
.cmt .sub{font-size:11.5px}
.cmt>div{min-width:0;flex:1}
.cmt b{font-size:12px}
.cmt p{margin:2px 0 3px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.4}
.cmt .sub{margin:0}
.replies{margin-top:6px}
.replies .cmt{border-top:0;padding:6px 0}

.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:7px 13px;background:var(--raised);font-size:13px;font-weight:500}
.banner{aspect-ratio:6/1;background:var(--surface) center/cover no-repeat;max-width:100%}
.chead{display:flex;gap:14px;align-items:center;padding:14px 16px 6px}
.chead img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--raised);flex:none}
.chead h2{font:700 19px/1.25 var(--serif);margin:0;overflow-wrap:anywhere}
.chead .sub{font-size:12px}
.cabout{padding:0 16px;color:var(--muted);font-size:12.5px;line-height:1.45;white-space:pre-wrap;overflow:hidden;max-height:3em;overflow-wrap:anywhere}
.cabout.full{max-height:none}
.ctabs{display:flex;gap:4px;padding:12px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:52px;background:var(--bg);z-index:1}
.ctabs button{border:0;background:none;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.ctabs button[aria-current="true"]{background:var(--fg);color:var(--bg)}
.row{display:flex;gap:10px;padding:8px 16px;width:100%;border:0;background:none;text-align:left}
.row .thumb{width:44%;flex:none;border-radius:8px}
.row .title{font-size:13.5px}
.row .sub{font-size:11.5px}
[data-ch]{cursor:pointer}
.notif{display:flex;gap:12px;padding:10px 16px;width:100%;border:0;background:none;text-align:left;align-items:center}
.notif.new{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.notif img.t{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none;background:var(--surface)}
.notif>div{min-width:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + var(--nav-h) + 14px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.frame{position:relative}
#unmute{position:absolute;left:12px;bottom:12px;z-index:3;border:0;border-radius:999px;padding:8px 14px;background:rgba(20,20,19,.85);color:#fff;font-size:13px;font-weight:600}
/* controlli propri sotto al video (verticale) o sopra in basso (schermo intero) */
.pwrap{position:relative;background:#000}
.ctl{background:var(--bg);padding:2px 6px 6px}
.crow{display:flex;align-items:center;gap:2px;min-width:0}
.cb{width:40px;height:40px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--fg);flex:none}
.cb:active{background:var(--raised)}
.cb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cb svg .f{fill:currentColor;stroke:none}
.cb.txt.on{background:var(--fg);color:var(--bg)}
.cb.txt{width:auto;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
#cTime{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:6px;white-space:nowrap}
#cSeek{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;display:block}
#cSeek::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--fg) var(--p,0%),var(--line) var(--p,0%))}
#cSeek::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);margin-top:-5px}
#cSeek::-moz-range-track{height:3px;background:var(--line)}
#cSeek::-moz-range-progress{height:3px;background:var(--fg)}
.reveal{display:none}
.land #player.open .pwrap,.full #player.open .pwrap{position:absolute;left:0;top:0;width:100%;height:var(--vh,100vh);z-index:5}
.land #player.open .ctl,.full #player.open .ctl{position:absolute;left:0;right:0;bottom:0;padding:24px 14px calc(var(--bot) + 8px);
  background:linear-gradient(transparent,rgba(0,0,0,.75));opacity:0;transition:opacity .25s;pointer-events:none;--fg:#fff;--line:rgba(255,255,255,.35);--muted:rgba(255,255,255,.8)}
.land #player.open .ctl.show,.full #player.open .ctl.show{opacity:1}
.land #player.open .ctl.show :is(button,input),.full #player.open .ctl.show :is(button,input){pointer-events:auto}
.land #player.open .reveal,.full #player.open .reveal{display:block;position:absolute;left:0;bottom:0;width:35%;height:46px;z-index:2}
.full:not(.land) #player.open .pwrap{width:var(--vh,100vh);height:var(--vw,100vw);transform-origin:top left;transform:translateX(var(--vw,100vw)) rotate(90deg)}
.full #player.open{overflow:hidden;padding:0;background:#000}
.full #player.open .pbar,.full #player.open .pinfo{display:none}
.full:not(.land) #player.open .frame{width:100%;height:100%;aspect-ratio:auto}
/* telefono in orizzontale: il player occupa tutto lo schermo, il resto si nasconde */
.land #player.open{overflow:hidden;padding:0;background:#000}
.land #player.open .pbar,.land #player.open .pinfo{display:none}
.land #player.open .frame{width:100%;height:100%;aspect-ratio:auto;max-width:none}
#ptr{position:fixed;left:50%;top:calc(var(--top) + 58px);z-index:15;width:38px;height:38px;margin-left:-19px;border-radius:50%;
  background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.3);display:grid;place-items:center;opacity:0;transform:translateY(-50px);pointer-events:none}
#ptr svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#ptr.go svg{animation:spin 1s linear infinite}
#ptr.back{transition:transform .25s ease,opacity .25s ease}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.spin svg{animation:none}}
</style>
</head>
<body>

<header>
  <h1><button class="logo" id="logo" aria-label="YT-, vai alla Home">YT-</button><span id="hTitle"></span></h1>
  <button class="icon-btn" id="btnSearch" aria-label="Cerca"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <button class="icon-btn" id="btnBell" aria-label="Notifiche"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="badge" id="bellBadge" hidden></span></button>
  <button class="icon-btn" id="btnRefresh" aria-label="Aggiorna"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  <button class="icon-btn" id="btnGear" aria-label="Impostazioni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<div id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></div>
<main>

<script>
"use strict";
const API = "https://www.googleapis.com/youtube/v3/";
const LS = "ytg.v1";

/* ---------- stato ---------- */
const DEF_OPT = { hideWatched: false, perChannel: 8, showHome: true, region: "IT" };
const S = Object.assign({
  key: "", clientId: "", token: "", tokenExp: 0, tokenScope: "", me: null, lastSync: 0,
  channels: [], videos: [], lastFetch: 0, watched: {}, avatars: {}, noLF: {},
  home: [], homeFetch: 0, homeMode: "", homeTags: [], seenNotif: 0, likes: [], hist: [], blocked: {},
  chMeta: {}, sCache: {}, relCache: {}, lastCost: null
}, load());
S.opt = Object.assign({}, DEF_OPT, S.opt || {});
function load(){ try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } }

/* Le liste grandi (video, avatar, cache) vanno in IndexedDB: localStorage su iPhone tiene circa 5 MB,
   e se si riempie l'app "dimentica" tutto e riscarica ogni volta, consumando unità. */
const BIG = ["videos", "home", "avatars", "chMeta", "sCache", "relCache"];
let idb = null, bigReady = false, saveT = 0, resetting = false;
function idbOpen(){
  return new Promise(res => {
    try {
      const r = indexedDB.open("ytg", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = r.onblocked = () => res(null);
    } catch { res(null); }
  });
}
function idbGet(k){
  return new Promise(res => {
    try { const q = idb.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }
    catch { res(undefined); }
  });
}
function idbPut(obj){ try { const st = idb.transaction("kv", "readwrite").objectStore("kv"); for (const k in obj) st.put(obj[k], k); } catch {} }
function idbClear(){
  return new Promise(res => {
    try { const t = idb.transaction("kv", "readwrite"); t.objectStore("kv").clear(); t.oncomplete = t.onerror = () => res(); }
    catch { res(); }
  });
}
async function loadBig(){
  idb = await Promise.race([idbOpen(), new Promise(r => setTimeout(() => r(null), 2000))]);
  if (idb) for (const k of BIG) { const v = await idbGet(k); if (v !== undefined && v !== null) S[k] = v; }
  for (const k of ["chMeta", "sCache", "relCache", "avatars"]) if (!S[k] || typeof S[k] !== "object") S[k] = {};
  bigReady = true;
}
function save(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 400); }
function saveNow(){
  clearTimeout(saveT);
  if (resetting) return;
  const small = {};
  for (const k in S) if (!(idb && BIG.includes(k))) small[k] = S[k];
  try { localStorage.setItem(LS, JSON.stringify(small)); }
  catch {
    try { localStorage.setItem(LS, JSON.stringify({ ...small, videos: (small.videos || []).slice(0, 600), home: [], sCache: {}, relCache: {} })); } catch {}
  }
  if (idb && bigReady) { const o = {}; BIG.forEach(k => o[k] = S[k]); idbPut(o); }
}
addEventListener("pagehide", saveNow);
document.addEventListener("visibilitychange", () => { if (document.hidden) saveNow(); });

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let busy = false, homeBusy = false, tab = "vHome", lastError = "", homeError = "";
let searchQ = "", searchRes = null, searchBusy = false, searchErr = "";
const CACHE = new Map();           // tutti i video visti (iscrizioni, home, ricerca) per aprirli nel player
const remember = list => { list.forEach(v => CACHE.set(v.id, v)); return list; };

function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3400);
}

/* ---------- API ---------- */
/* Quota: 10.000 unità al giorno, azzerate a mezzanotte in California (le 9:00 in Italia) */
const qDay = () => new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" });
function spend(path, method){
  const cost = path.startsWith("search") ? 100 : (method && method !== "GET") ? 50 : 1;
  const d = qDay(); if (S.qDay !== d) { S.qDay = d; S.qUsed = 0; S.quotaOut = ""; }
  S.qUsed = (S.qUsed || 0) + cost;
}
const quotaOut = () => S.quotaOut === qDay();
function markQuota(e){ if (e?.reason === "quotaExceeded") { S.quotaOut = qDay(); save(); } }

async function api(path, params){
  if (!S.key) throw new Error("Manca la chiave API: aggiungila in Impostazioni.");
  spend(path, "GET");
  const r = await fetch(API + path + "?" + new URLSearchParams({ ...params, key: S.key }));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e = new Error(j.error?.message || ("Errore " + r.status));
    e.status = r.status; e.reason = j.error?.errors?.[0]?.reason; markQuota(e); throw e;
  }
  return j;
}

/* ---------- accesso Google (OAuth) ---------- */
const SCOPE = "https://www.googleapis.com/auth/youtube.force-ssl";   // lettura iscrizioni + scrittura commenti
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/, "");
const tokenOk = () => S.token && S.tokenScope === SCOPE && Date.now() < S.tokenExp - 60000;

function startLogin(after){
  if (!S.clientId) { toast("Prima inserisci l'ID client in Impostazioni"); closeSheets(); go("vSettings"); return; }
  const state = Math.random().toString(36).slice(2);
  try { sessionStorage.setItem("ytg.state", state); sessionStorage.setItem("ytg.after", JSON.stringify(after || { do: "sync" })); } catch {}
  const p = new URLSearchParams({ client_id: S.clientId, redirect_uri: redirectUri(), response_type: "token",
    scope: SCOPE, include_granted_scopes: "true", state, ...(S.me ? {} : { prompt: "select_account" }) });
  saveNow();
  location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + p;
}

function readLoginReturn(){
  if (!location.hash.includes("access_token") && !location.hash.includes("error=")) return null;
  const h = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, "", location.pathname);
  let st = null, after = { do: "sync" };
  try { st = sessionStorage.getItem("ytg.state"); after = JSON.parse(sessionStorage.getItem("ytg.after")) || after; } catch {}
  if (h.get("error")) { setTimeout(() => toast("Accesso annullato"), 300); return null; }
  if (st && h.get("state") !== st) { setTimeout(() => toast("Accesso non valido, riprova"), 300); return null; }
  S.token = h.get("access_token"); S.tokenScope = SCOPE;
  S.tokenExp = Date.now() + (+h.get("expires_in") || 3600) * 1000; save();
  return after;
}

async function apiAuth(path, params, body){
  spend(path, body ? "POST" : "GET");
  const r = await fetch(API + path + "?" + new URLSearchParams(params), {
    method: body ? "POST" : "GET",
    headers: { Authorization: "Bearer " + S.token, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { S.token = ""; save(); const e = new Error("Sessione scaduta: accedi di nuovo"); e.relogin = true; throw e; }
  if (!r.ok) { const e = new Error(j.error?.message || ("Errore " + r.status)); e.reason = j.error?.errors?.[0]?.reason; throw e; }
  return j;
}

async function syncSubs(){
  if (!tokenOk()) return startLogin({ do: "sync" });
  if (busy) return;
  busy = true; spin(true);
  try {
    const me = await apiAuth("channels", { part: "snippet", mine: "true" });
    const c = me.items?.[0];
    S.me = c ? { title: c.snippet.title, thumb: c.snippet.thumbnails?.default?.url || "" } : { title: "Account Google", thumb: "" };
    const subs = []; let page = "";
    do {
      const j = await apiAuth("subscriptions", { part: "snippet", mine: "true", maxResults: 50, order: "alphabetical", ...(page ? { pageToken: page } : {}) });
      for (const s of j.items || []) subs.push({ id: s.snippet.resourceId.channelId, title: s.snippet.title,
        thumb: s.snippet.thumbnails?.default?.url || "" });
      page = j.nextPageToken || "";
    } while (page);
    const manual = S.channels.filter(c => c.manual && !subs.some(s => s.id === c.id));
    S.channels = subs.concat(manual);
    S.videos = S.videos.filter(v => S.channels.some(c => c.id === v.ch));
    try {
      const lk = await apiAuth("videos", { part: "snippet", myRating: "like", maxResults: 50 });
      S.likes = (lk.items || []).map(v => ({ cat: v.snippet.categoryId, ch: v.snippet.channelId,
        tags: (v.snippet.tags || []).slice(0, 12).map(t => t.toLowerCase()) }));
    } catch {}
    S.lastSync = Date.now(); S.lastFetch = 0; S.homeFetch = 0; save();
    toast(`Iscrizioni sincronizzate: ${subs.length} canali`);
  } catch (e) { toast(e.message); }
  finally { busy = false; spin(false); }
  if (tab === "vChannels") renderChannels(); else if (tab === "vSettings") renderSettings();
  refresh();
}

/* ---------- canali ---------- */
async function channelInfo(ids){
  const out = [];
  for (let i = 0; i < ids.length; i += 50) {
    const j = await api("channels", { part: "snippet", id: ids.slice(i, i + 50).join(","), maxResults: 50 });
    for (const c of j.items || []) out.push({ id: c.id, title: c.snippet.title, thumb: c.snippet.thumbnails?.default?.url || "" });
  }
  return out;
}
async function resolveChannel(input){
  input = input.trim();
  const uc = input.match(/UC[\w-]{22}/);
  if (uc) return uc[0];
  let handle = (input.match(/@[\w.\-]+/) || [])[0];
  if (!handle) handle = "@" + input.replace(/^.*\//, "");
  const j = await api("channels", { part: "id", forHandle: handle });
  if (!j.items?.length) throw new Error("Canale non trovato: " + input);
  return j.items[0].id;
}
const avatarOf = id => S.channels.find(c => c.id === id)?.thumb || S.avatars[id] || "";
async function ensureAvatars(list){
  const miss = [...new Set(list.map(v => v.ch))].filter(id => !avatarOf(id));
  if (!miss.length || !S.key) return;
  try {
    (await channelInfo(miss.slice(0, 150))).forEach(c => S.avatars[c.id] = c.thumb);
    const keys = Object.keys(S.avatars); if (keys.length > 600) keys.slice(0, keys.length - 600).forEach(k => delete S.avatars[k]);
    save(); rerender(); if ($("#player").classList.contains("open")) renderRelated();
  } catch {}
}

/* ---------- video ---------- */
function secs(iso){
  const m = /P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso || "") || [];
  return (+m[1]||0)*86400 + (+m[2]||0)*3600 + (+m[3]||0)*60 + (+m[4]||0);
}
const looksShort = (v, d) => (d > 0 && d <= 180) || /#shorts?\b/i.test(v.snippet.title + " " + (v.snippet.description || "").slice(0, 300));
function toVideo(v){
  const t = v.snippet.thumbnails || {}, d = secs(v.contentDetails?.duration);
  return { id: v.id, title: v.snippet.title, ch: v.snippet.channelId, chTitle: v.snippet.channelTitle,
    at: v.snippet.publishedAt, dur: d, live: v.snippet.liveBroadcastContent === "live",
    views: +v.statistics?.viewCount || 0, likes: +v.statistics?.likeCount || 0, comments: +v.statistics?.commentCount || 0,
    thumb: (t.maxres || t.standard || t.high || t.medium || t.default || {}).url || "",
    desc: (v.snippet.description || "").slice(0, 200), cat: v.snippet.categoryId || "",
    tags: (v.snippet.tags || []).slice(0, 8).map(t => t.toLowerCase()) };
}
async function pool(items, size, fn){
  const out = []; let i = 0;
  await Promise.all(Array.from({ length: Math.min(size, items.length) }, async () => {
    while (i < items.length) { const k = i++; out[k] = await fn(items[k]).catch(e => ({ error: e })); }
  }));
  return out;
}
async function videoDetails(ids){
  const batches = []; for (let i = 0; i < ids.length; i += 50) batches.push(ids.slice(i, i + 50));
  const pages = await pool(batches, 8, b => api("videos", { part: "snippet,contentDetails,statistics", id: b.join(",") }));
  const firstErr = pages.find(p => p?.error)?.error; if (firstErr && pages.every(p => p?.error)) throw firstErr;
  return pages.flatMap(p => p?.items || []);
}

/* Iscrizioni: playlist "UULF" = solo video normali (niente Shorts). Se manca, "UU" + filtro durata. */
async function channelUploads(ch){
  const tail = ch.id.slice(2), n = S.opt.perChannel;
  if (!S.noLF[ch.id]) {
    try {
      const j = await api("playlistItems", { part: "contentDetails", playlistId: "UULF" + tail, maxResults: n });
      return { ids: (j.items || []).map(i => i.contentDetails.videoId), strict: true };
    } catch (e) {
      if (e.reason === "quotaExceeded" || /API key|referer|keyInvalid/i.test(e.message)) throw e;
      S.noLF[ch.id] = 1;
    }
  }
  const j = await api("playlistItems", { part: "contentDetails", playlistId: "UU" + tail, maxResults: n });
  return { ids: (j.items || []).map(i => i.contentDetails.videoId), strict: false };
}

const spin = on => $("#btnRefresh").classList.toggle("spin", on);
const errMsg = e => e.reason === "quotaExceeded" ? "Unità giornaliere finite: l'app torna a funzionare dopo le 9:00" : e.message;

const usedToday = () => S.qDay === qDay() ? S.qUsed || 0 : 0;

/* Aggiornamento delle iscrizioni, pensato per consumare poche unità:
   1) channels.list legge quanti video ha ogni canale, 50 canali per unità (460 canali = 10 unità);
   2) si scaricano gli ultimi video solo dei canali il cui numero è cambiato (1 unità ciascuno),
      più un piccolo controllo a rotazione di 4 canali, nel caso il contatore di YouTube sia in ritardo;
   3) si chiedono i dettagli solo dei video mai visti (1 unità ogni 50 video).
   Il primo aggiornamento scarica tutti i canali una volta sola. */
async function refresh(manual){
  if (busy) return;
  if (!S.key) { if (manual) { toast("Aggiungi prima la chiave API"); go("vSettings"); } return; }
  if (!S.channels.length) { if (manual) toast("Nessun canale: accedi o aggiungili dalla scheda Canali"); return; }
  busy = true; spin(true);
  const u0 = usedToday(), now = Date.now(), meta = S.chMeta;
  try {
    // 1) quanti video ha ogni canale
    $("#hTitle").textContent = tab === "vSubs" ? "Controllo i canali…" : LABEL(tab);
    const ids = S.channels.map(c => c.id), batches = [], counts = {};
    for (let i = 0; i < ids.length; i += 50) batches.push(ids.slice(i, i + 50));
    const pages = await pool(batches, 4, b => api("channels", { part: "statistics", id: b.join(","), maxResults: 50 }));
    const firstErr = pages.find(p => p?.error)?.error;
    if (firstErr && pages.every(p => p?.error)) throw firstErr;
    pages.forEach(p => (p?.items || []).forEach(c => counts[c.id] = +c.statistics?.videoCount || 0));

    // 2) quali canali scaricare
    const newest = {};
    for (const v of S.videos) if (!newest[v.ch] || v.at > newest[v.ch]) newest[v.ch] = v.at;
    const changed = S.channels.filter(c => {
      const m = meta[c.id];
      if (!m) return true;
      if (c.id in counts && counts[c.id] !== m.n) return true;
      return m.up && now - m.at > 2 * 3600000;                 // c'era una première in arrivo
    });
    const inChanged = new Set(changed.map(c => c.id));
    const active = c => newest[c.id] && now - Date.parse(newest[c.id]) < 14 * 864e5;
    const sweep = S.channels.filter(c => meta[c.id] && !inChanged.has(c.id) && now - meta[c.id].at > (active(c) ? 3 : 48) * 3600000)
      .sort((a, b) => (active(b) - active(a)) || meta[a.id].at - meta[b.id].at).slice(0, 4);
    const todo = changed.concat(sweep);
    let done = 0; progress(0, todo.length);
    const res = await pool(todo, 12, ch => channelUploads(ch).finally(() => progress(++done, todo.length)));
    if (todo.length && res.every(r => r?.error)) throw res[0].error;

    // 3) dettagli solo dei video nuovi (e delle dirette, per sapere se sono finite)
    const known = new Map(S.videos.map(v => [v.id, v]));
    const want = new Set(S.videos.filter(v => v.live).map(v => v.id)), lax = new Set();
    res.forEach((r, i) => {
      if (!r?.ids) return;
      const prev = new Set(meta[todo[i].id]?.ids || []);
      r.ids.forEach(id => { if (!known.has(id) && !prev.has(id)) want.add(id); if (!r.strict) lax.add(id); });
    });
    const det = want.size ? await videoDetails([...want]) : [];
    const fresh = new Map(), skipped = new Set(), upcoming = new Set();
    for (const v of det) {
      if (v.snippet.liveBroadcastContent === "upcoming") { upcoming.add(v.id); continue; }
      if (lax.has(v.id) && looksShort(v, secs(v.contentDetails.duration))) { skipped.add(v.id); continue; }
      fresh.set(v.id, toVideo(v));
    }
    res.forEach((r, i) => {
      if (!r?.ids) return;
      const id = todo[i].id, prev = new Set(meta[id]?.ids || []);
      meta[id] = { n: id in counts ? counts[id] : (meta[id]?.n ?? -1), at: now,
        ids: r.ids.filter(x => known.has(x) || fresh.has(x) || skipped.has(x) || prev.has(x)),
        up: r.ids.some(x => upcoming.has(x)) ? 1 : 0 };
    });

    // unisci, tieni al massimo "Video per canale" video per iscrizione
    for (const [id, v] of fresh) known.set(id, v);
    const subsSet = new Set(ids), per = {}, keep = [];
    for (const v of [...known.values()].sort((a, b) => b.at.localeCompare(a.at))) {
      if (!subsSet.has(v.ch)) continue;
      per[v.ch] = (per[v.ch] || 0) + 1;
      if (per[v.ch] <= Math.max(5, S.opt.perChannel)) keep.push(v);
    }
    if (!S.seenNotif) S.seenNotif = keep[0] ? Date.parse(keep[0].at) : now;
    S.videos = remember(keep.slice(0, 4000)); S.lastFetch = now; lastError = "";
    S.lastCost = usedToday() - u0; save();
    if (firstErr || res.some(r => r?.error)) toast("Alcuni canali non si sono aggiornati");
    else if (manual) toast(`Iscrizioni aggiornate · ${S.lastCost} unità`);
  } catch (e) { lastError = errMsg(e); toast(lastError); }
  finally { busy = false; spin(false); progress(0, 0); updateBell(); rerender(); }
}

/* Video popolari per categoria: servono sia alla Home sia ai "Video simili".
   Restano in memoria 3 ore, così aprire video o tornare in Home non costa nulla. */
async function catChart(c, force){
  const key = S.opt.region + ":" + (c || "all"), rc = S.relCache;
  if (!force && rc[key] && Date.now() - rc[key].at < 3 * 3600000) return remember(rc[key].list);
  const j = await api("videos", { part: "snippet,contentDetails,statistics", chart: "mostPopular", regionCode: S.opt.region, maxResults: 50, ...(c ? { videoCategoryId: c } : {}) });
  const list = remember((j.items || []).filter(v => v.snippet.liveBroadcastContent !== "upcoming" && !looksShort(v, secs(v.contentDetails.duration))).map(toVideo));
  rc[key] = { at: Date.now(), list };
  for (const k of Object.keys(rc)) if (Date.now() - rc[k].at > 24 * 3600000) delete rc[k];
  save(); return list;
}

/* Ricerca su YouTube: 100 unità, fisse per Google. La stessa ricerca ripetuta entro 24 ore è gratis. */
async function searchVideos(q, max){
  const key = S.opt.region + ":" + q.toLowerCase().trim(), sc = S.sCache, hit = sc[key];
  if (hit && Date.now() - hit.at < 24 * 3600000) return { list: remember(hit.list), cached: true };
  const j = await api("search", { part: "id", q, type: "video", maxResults: max, regionCode: S.opt.region, relevanceLanguage: "it", safeSearch: "none" });
  const ids = (j.items || []).map(i => i.id.videoId).filter(Boolean);
  const det = ids.length ? await videoDetails(ids) : [], order = new Map(ids.map((id, i) => [id, i]));
  const list = remember(det.filter(v => v.snippet.liveBroadcastContent !== "upcoming" && !looksShort(v, secs(v.contentDetails.duration)))
    .sort((a, b) => order.get(a.id) - order.get(b.id)).map(toVideo));
  sc[key] = { at: Date.now(), list };
  Object.keys(sc).sort((a, b) => sc[b].at - sc[a].at).slice(25).forEach(k => delete sc[k]);
  save(); return { list, cached: false };
}

/* Home "Per te": YouTube non dà i consigliati personali via API, quindi li ricostruiamo dai tuoi segnali:
   like su YouTube (peso 3), video guardati in YTG (peso 2), video dei tuoi canali (peso basso).
   Da qui escono le categorie preferite (tendenze per categoria, 1 unità ciascuna)
   e le parole chiave preferite (ricerche recenti, 100 unità ciascuna). */
const CATS = { "1":"Film e animazione","2":"Motori","10":"Musica","15":"Animali","17":"Sport","19":"Viaggi","20":"Videogiochi",
  "22":"Persone e blog","23":"Comicità","24":"Intrattenimento","25":"Notizie","26":"Stile e consigli","27":"Istruzione","28":"Scienza e tecnologia","29":"Attivismo" };
const STOP = new Set(["video","youtube","shorts","short","new","2024","2025","2026","official","ita","italia","italiano","the","and","di","il","la","e"]);
function interests(){
  const cat = {}, tag = {}, chNames = new Set(S.channels.map(c => c.title.toLowerCase()));
  const add = (v, w) => {
    if (!v) return;
    if (v.cat && CATS[v.cat]) cat[v.cat] = (cat[v.cat] || 0) + w;
    for (const t of new Set(v.tags || [])) if (t.length > 2 && t.length < 32 && !STOP.has(t) && !chNames.has(t)) tag[t] = (tag[t] || 0) + w;
  };
  S.likes.forEach(v => add(v, 3)); S.hist.forEach(v => add(v, 2)); S.videos.slice(0, 200).forEach(v => add(v, .25));
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  return { cats: top(cat).slice(0, 4), tags: top(tag).filter(t => tag[t] >= 2).slice(0, 4) };
}
function interleave(lists){
  const out = [], seen = new Set(); let i = 0, more = true;
  while (more) { more = false; for (const l of lists) if (i < l.length) { more = true; const v = l[i]; if (!seen.has(v.id)) { seen.add(v.id); out.push(v); } } i++; }
  return out;
}
async function loadHome(manual){
  if (homeBusy || !S.key) return;
  homeBusy = true; spin(true); rerender();
  try {
    const { cats, tags } = interests();
    const ok = v => !S.watched[v.id] && !S.blocked[v.ch];
    let lists = [];
    if (cats.length || tags.length) {
      const jobs = cats.map(c => catChart(c, manual).catch(() => []));
      lists = (await Promise.all(jobs)).map(l => l.filter(ok));
      S.homeMode = "foryou"; S.homeTags = cats.map(c => CATS[c]).concat(tags);
    }
    if (!lists.some(l => l.length)) {
      lists = [(await catChart("", manual)).filter(ok)];
      S.homeMode = "trend"; S.homeTags = [];
    }
    S.home = remember(interleave(lists).slice(0, 60));
    S.homeFetch = Date.now(); homeError = ""; save();
    if (manual) toast("Home aggiornata");
    ensureAvatars(S.home);
  } catch (e) { homeError = errMsg(e); toast(homeError); }
  finally { homeBusy = false; spin(false); rerender(); }
}

/* Ricerca su tutto YouTube (costa 100 unità di quota a ricerca) */
async function doSearch(q){
  searchQ = q.trim(); if (!searchQ) return;
  if (!S.key) { toast("Aggiungi prima la chiave API"); return go("vSettings"); }
  searchBusy = true; searchErr = ""; searchRes = null; renderSearch();

}

/* ---------- formattazione ---------- */
function fmtDur(s){
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0");
}
function ago(iso){
  const s = (Date.now() - new Date(iso)) / 1000;
  const u = [[31536000,"anno","anni"],[2592000,"mese","mesi"],[604800,"settimana","settimane"],[86400,"giorno","giorni"],[3600,"ora","ore"],[60,"minuto","minuti"]];
  for (const [n, a, b] of u) if (s >= n) { const k = Math.floor(s/n); return k + " " + (k === 1 ? a : b) + " fa"; }
  return "adesso";
}
function views(n){
  if (!n) return "";
  if (n >= 1e9) return (n/1e9).toFixed(1).replace(".0","").replace(".",",") + " Mrd di visualizzazioni";
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(".0","").replace(".",",") + " Mln di visualizzazioni";
  if (n >= 1e3) return Math.round(n/1e3) + "K visualizzazioni";
  return n + " visualizzazioni";
}
function bucket(iso){
  const d = new Date(iso), now = new Date(), day = 864e5;
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if (d >= start) return "Oggi";
  if (d >= start - day) return "Ieri";
  if (d >= start - 6*day) return "Questa settimana";
  if (d >= start - 30*day) return "Questo mese";
  return "Più vecchi";
}

function card(x){
  const bits = [esc(x.chTitle), x.views ? views(x.views) : "", ago(x.at)].filter(Boolean).join(" · ");
  return `<button class="card${S.watched[x.id] ? " seen" : ""}" data-v="${x.id}">
    <div class="thumb"><img loading="lazy" src="${esc(x.thumb)}" alt="">
      ${x.live ? `<span class="dur live">IN DIRETTA</span>` : x.dur ? `<span class="dur">${fmtDur(x.dur)}</span>` : ""}</div>
    <div class="meta"><img class="avatar" loading="lazy" src="${esc(avatarOf(x.ch))}" alt="${esc(x.chTitle)}" data-ch="${x.ch}">
      <div><div class="title">${esc(x.title)}</div><div class="sub">${bits}</div></div></div>
  </button>`;
}

const ok = () => yp && typeof yp.getPlayerState === "function";
function paintCtl(){
  if (!ok()) { $("#cPlay").innerHTML = CI.play; $("#cMute").innerHTML = CI.vol; $("#cFull").innerHTML = CI.full; return; }
  const st = yp.getPlayerState();

function tick(){
  if (!ok() || seeking) return;
  const d = yp.getDuration?.() || 0, t = yp.getCurrentTime?.() || 0, s = $("#cSeek");
  const pc = d ? t / d * 1000 : 0; s.value = pc; s.style.setProperty("--p", pc / 10 + "%");

  const c = $("#pCtl"); c.classList.add("show"); clearTimeout(ctlTimer);

function ctl(a){
  if (!ok()) return;

  if (a === "cBack") yp.seekTo(Math.max(0, yp.getCurrentTime() - 10), true);

    const cur = yp.getPlaybackRate(), i = av.indexOf(cur); yp.setPlaybackRate(av[(i + 1) % av.length] || 1);

/* ---------- video simili ----------
   L'API di YouTube non fornisce più i "video correlati". Li ricostruiamo per argomento:
   1) tutti i video già noti all'app (Home, iscrizioni, ricerche) ordinati per somiglianza con quello aperto;
   2) i video popolari della stessa categoria (1 unità, ricordati per 3 ore);
   3) su richiesta, una ricerca con le parole chiave del video (100 unità).
   I video dello stesso canale sono esclusi. */
const STOPW = new Set("il lo la i gli le un una uno di da del della dei delle in con su per tra fra e o ma che non come cosa perché quando questo questa sono è ho ha the a an of to and or in on for with is are my your how what why vs ft feat official video parte part ep episodio".split(" "));
function words(v){
  const t = (v.title || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]+/g, " ").split(/\s+/);
  return new Set(t.filter(w => w.length > 2 && !STOPW.has(w) && !/^\d+$/.test(w)).concat((v.tags || []).map(s => s.toLowerCase())));
}
let relExtra = [];            // risultati della ricerca "simili"
function similar(x){
  const kw = words(x), seen = new Set([x.id]), out = [];
  for (const v of CACHE.values()) {
    if (seen.has(v.id) || v.ch === x.ch || !v.thumb) continue; seen.add(v.id);
    const w = words(v); let s = 0;
    for (const k of w) if (kw.has(k)) s += k.includes(" ") ? 4 : 3;
    if (v.cat && v.cat === x.cat) s += 1;
    if (S.watched[v.id]) s -= 2;
    if (s > 0) out.push([s, v]);
  }
  return out.sort((a, b) => b[0] - a[0] || b[1].at.localeCompare(a[1].at)).map(p => p[1]);
}
function renderRelated(){
  const x = current, box = $("#rel"); if (!x || !box) return;
  const ids = new Set(), list = [];
  for (const v of [...relExtra, ...similar(x)]) if (!ids.has(v.id) && v.ch !== x.ch && v.id !== x.id) { ids.add(v.id); list.push(v); }
  box.innerHTML = list.length ? list.slice(0, 20).map(card).join("") : `<div class="status">Cerco video sullo stesso argomento…</div>`;
}
async function loadRelated(x){
  relExtra = [];
  const c = x.cat; if (!c || !S.key || quotaOut()) return;
  try { ensureAvatars(await catChart(c)); } catch {}
  if (current?.id === x.id) renderRelated();
}
async function searchRelated(){

  const kw = [...words(x)].filter(k => !k.includes(" ")).slice(0, 5).join(" ") || x.title;

async function rate(kind){
  const video = current; if (!video) return;
  const next = myRating === kind ? "none" : kind;
  if (!tokenOk()) {
    try { sessionStorage.setItem("ytg.video", JSON.stringify(video)); } catch {}
    return startLogin({ do: "rate", rating: next, video: video.id, tab });
  }
  const prev = myRating; myRating = next; paintRating();
  if (prev === "like" && next !== "like") video.likes = Math.max(0, (video.likes || 1) - 1);
  if (next === "like") video.likes = (video.likes || 0) + 1;
  const l = $("#vLikes"); if (l) l.textContent = video.likes ? num(video.likes) + " Mi piace" : "";
  try {
    spend("videos/rate", "POST");
    const r = await fetch(API + "videos/rate?" + new URLSearchParams({ id: video.id, rating: next }), { method: "POST", headers: { Authorization: "Bearer " + S.token } });
    if (r.status === 401) { S.token = ""; save(); myRating = prev; paintRating(); return rate(kind); }
    if (!r.ok) throw new Error("Errore " + r.status);
    if (next === "like") { S.likes = [{ cat: video.cat, ch: video.ch, tags: video.tags || [] }].concat(S.likes).slice(0, 80); save(); }
  } catch (e) { myRating = prev; paintRating(); toast("Non riuscito: " + e.message); }
}

/* ---------- sottotitoli ----------
   Il player di YouTube li gestisce con il modulo "captions": lo carico, leggo le lingue disponibili
   e scelgo la traccia. La scelta viene ricordata per i video successivi. */
let ccOn = false;
function ccTracks(){ try { return yp.getOption("captions", "tracklist") || []; } catch { return []; } }
function applyCC(lang, tr){
  if (!ok()) return;
  try {
    yp.loadModule("captions");
    const tracks = ccTracks();
    const pick = tracks.find(t => t.languageCode === lang) || tracks.find(t => t.languageCode?.startsWith(lang.split("-")[0])) || tracks[0];
    if (!pick && tracks.length === 0) { ccOn = true; paintCC(); return; }      // modulo caricato, tracce ancora in arrivo
    const opt = { languageCode: pick.languageCode };
    if (tr && pick.languageCode !== tr) opt.translationLanguage = { languageCode: tr };
    yp.setOption("captions", "track", opt);
    ccOn = true;
  } catch {}
  paintCC();
}
function ccOff(){
  try { yp.setOption("captions", "track", {}); yp.unloadModule("captions"); } catch {}
  ccOn = false; S.opt.cc = ""; S.opt.ccTr = ""; save(); paintCC();
}
function paintCC(){ $("#cCC")?.classList.toggle("on", ccOn); }
async function ccMenu(){
  if (!ok()) return;
  try { yp.loadModule("captions"); } catch {}
  let tracks = ccTracks();
  for (let i = 0; i < 8 && !tracks.length; i++) { await new Promise(r => setTimeout(r, 250)); tracks = ccTracks(); }
  if (!tracks.length) { if (!ccOn) { try { yp.unloadModule("captions"); } catch {} } toast("Questo video non ha sottotitoli"); return; }
  const items = tracks.slice(0, 12).map(t => ["cc:" + t.languageCode, (t.displayName || t.languageName || t.languageCode) + (t.kind === "asr" ? " (automatici)" : "")]);
  if (!tracks.some(t => t.languageCode?.startsWith("it"))) items.push(["cc:" + tracks[0].languageCode + ":it", "Traduci in italiano"]);
  if (ccOn) items.push(["ccOff", "Disattiva sottotitoli"]);
  items.push(["closeMenu", "Annulla"]);
  showMenu(items);
}

function showMenu(items){

    <div class="chead"><img src="${esc(thumb)}" alt=""><div style="min-width:0;flex:1"><h2>${esc(s.title)}</h2><div class="sub">${esc(meta)}</div></div></div>
    <div style="padding:6px 16px 10px"><button class="btn${isSub(CH.id) ? " ghost" : ""}" id="subBtn" data-act="subscribe" style="padding:8px 16px;font-size:13px">${isSub(CH.id) ? "Iscritto ✓" : "Iscriviti"}</button></div>
    ${s.description ? `<div class="cabout" id="cAbout">${esc(s.description)}</div><div style="padding:0 16px"><button class="more" data-act="chAbout">Altro</button></div>` : ""}
    <div class="ctabs"><button data-ctab="videos" aria-current="${CH.tab === "videos"}">Video</button><button data-ctab="playlists" aria-current="${CH.tab === "playlists"}">Playlist</button></div>
    <div id="chList"></div><div style="padding:4px 16px"><button class="more" id="chMoreBtn" data-act="chMore" hidden>Carica altri video</button></div>`;
}

function rowHTML(x){
  return `<button class="row" data-v="${x.id}"><div class="thumb"><img loading="lazy" src="${esc(x.thumb)}" alt="">
    ${x.live ? `<span class="dur live">LIVE</span>` : x.dur ? `<span class="dur">${fmtDur(x.dur)}</span>` : ""}</div>
    <div style="min-width:0"><div class="title">${esc(x.title)}</div><div class="sub">${[x.views ? views(x.views) : "", ago(x.at)].filter(Boolean).join(" · ")}</div></div></button>`;
}

async function loadChanVideos(first){
  const id = CH.id, list = $("#chList"), btn = $("#chMoreBtn");
  if (first) list.innerHTML = `<div class="status" style="padding:12px 16px">Carico i video…</div>`;
  const fetchPage = pl => api("playlistItems", { part: "contentDetails", playlistId: pl + id.slice(2), maxResults: 30, ...(CH.page ? { pageToken: CH.page } : {}) });
  try {
    let j;
    if (CH.strict) { try { j = await fetchPage("UULF"); } catch (e) { if (e.reason === "quotaExceeded") throw e; CH.strict = false; CH.page = ""; } }
    if (!CH.strict) j = await fetchPage("UU");
    if (CH?.id !== id) return;
    const det = await videoDetails((j.items || []).map(i => i.contentDetails.videoId));
    const vids = remember(det.filter(v => v.snippet.liveBroadcastContent !== "upcoming" && (CH.strict || !looksShort(v, secs(v.contentDetails.duration)))).map(toVideo))
      .sort((a, b) => b.at.localeCompare(a.at));
    CH.vids = first ? vids : CH.vids.concat(vids); CH.page = j.nextPageToken || "";
    if (CH.tab !== "videos") return;
    list.innerHTML = CH.vids.length ? CH.vids.map(rowHTML).join("") : `<div class="status" style="padding:12px 16px">Nessun video.</div>`;
    btn.hidden = !CH.page;
  } catch (e) { if (CH?.id === id) list.innerHTML = `<div class="status err" style="padding:12px 16px">${esc(errMsg(e))}</div>`; }
}

async function chanTab(tabName){
  CH.tab = tabName;
  document.querySelectorAll(".ctabs button").forEach(b => b.setAttribute("aria-current", b.dataset.ctab === tabName));
  const list = $("#chList"), btn = $("#chMoreBtn");
  if (tabName === "videos") { list.innerHTML = CH.vids.map(rowHTML).join(""); btn.hidden = !CH.page; return; }
  btn.hidden = true;
  if (!CH.playlists) {
    list.innerHTML = `<div class="status" style="padding:12px 16px">Carico le playlist…</div>`;
    try {
      const j = await api("playlists", { part: "snippet,contentDetails", channelId: CH.id, maxResults: 50 });
      CH.playlists = j.items || [];
    } catch (e) { list.innerHTML = `<div class="status err" style="padding:12px 16px">${esc(errMsg(e))}</div>`; return; }
  }
  if (CH.tab !== "playlists") return;
  list.innerHTML = CH.playlists.length ? CH.playlists.map(p => {
    const t = p.snippet.thumbnails || {};
    return `<button class="row" data-pl="${p.id}" data-plt="${esc(p.snippet.title)}"><div class="thumb"><img loading="lazy" src="${esc((t.medium || t.default || {}).url || "")}" alt="">
      <span class="dur">${p.contentDetails.itemCount} video</span></div>
      <div style="min-width:0"><div class="title">${esc(p.snippet.title)}</div><div class="sub">Playlist</div></div></button>`;
  }).join("") : `<div class="status" style="padding:12px 16px">Questo canale non ha playlist pubbliche.</div>`;
}

async function openPlaylist(plId, title){
  const list = $("#chList");
  list.innerHTML = `<div style="padding:8px 16px"><button class="more" data-ctab="playlists">‹ Tutte le playlist</button>
    <div style="font:700 15px var(--serif);margin-top:4px">${esc(title)}</div></div><div id="plItems" class="status" style="padding:8px 16px">Carico…</div>`;
  try {
    const j = await api("playlistItems", { part: "contentDetails", playlistId: plId, maxResults: 50 });
    const ids = (j.items || []).map(i => i.contentDetails.videoId);
    const det = await videoDetails(ids), order = new Map(ids.map((id, i) => [id, i]));
    const vids = remember(det.map(toVideo).sort((a, b) => order.get(a.id) - order.get(b.id)));
    const box = $("#plItems"); if (!box) return;
    box.className = ""; box.style.padding = "0";
    box.innerHTML = vids.map(rowHTML).join("") || `<div class="status" style="padding:8px 16px">Playlist vuota.</div>`;
  } catch (e) { const box = $("#plItems"); if (box) box.innerHTML = esc(errMsg(e)); }
}

/* Iscriviti / annulla iscrizione sul tuo account YouTube (50 unità) */
async function toggleSub(id, title, thumb){
  id = id || CH.id; title = title || CH.info?.snippet?.title || ""; thumb = thumb || CH.info?.snippet?.thumbnails?.default?.url || "";
  if (!tokenOk()) {
    try { sessionStorage.setItem("ytg.video", current ? JSON.stringify(current) : ""); } catch {}
    return startLogin({ do: "sub", ch: id, title, thumb, video: current?.id || "", tab });
  }
  const btns = [$("#subBtn"), $("#vSub")].filter(Boolean); btns.forEach(b => b.disabled = true);
  try {
    if (isSub(id)) {
      const j = await apiAuth("subscriptions", { part: "id", mine: "true", forChannelId: id });
      const sid = j.items?.[0]?.id;
      if (sid) {
        spend("subscriptions", "DELETE");
        const r = await fetch(API + "subscriptions?id=" + encodeURIComponent(sid), { method: "DELETE", headers: { Authorization: "Bearer " + S.token } });
        if (r.status === 401) { const e = new Error("Sessione scaduta"); e.relogin = true; throw e; }
        if (!r.ok && r.status !== 404) throw new Error("Errore " + r.status);
      }
      S.channels = S.channels.filter(c => c.id !== id); S.videos = S.videos.filter(v => v.ch !== id);
      toast("Iscrizione annullata");
    } else {
      await apiAuth("subscriptions", { part: "snippet" }, { snippet: { resourceId: { kind: "youtube#channel", channelId: id } } });
      S.channels.push({ id, title, thumb }); S.lastFetch = 0; toast("Iscritto a " + title);
    }
    save(); updateBell(); rerender(); paintSub(id);
  } catch (e) {
    if (e.relogin || e.reason === "insufficientPermissions") { S.token = ""; save(); return toggleSub(id, title, thumb); }
    toast("Operazione non riuscita: " + errMsg(e));
  } finally { btns.forEach(b => b.disabled = false); }
}
function paintSub(id){
  const on = isSub(id);
  const a = $("#subBtn"); if (a && CH?.id === id) { a.textContent = on ? "Iscritto ✓" : "Iscriviti"; a.classList.toggle("ghost", on); }
  const b = $("#vSub"); if (b && current?.ch === id) { b.textContent = on ? "Iscritto" : "Iscriviti"; b.classList.toggle("on", on); }
}

/* ---------- navigazione ---------- */
const TITLES = { vHome: "Home", vSubs: "Iscrizioni", vSearch: "Cerca", vChannels: "Canali", vSettings: "Impostazioni" };
const LABEL = t => t === "vHome" ? "" : TITLES[t];
function progress(done, total){ $("#hTitle").textContent = total && tab === "vSubs" ? `Aggiorno ${done}/${total}` : LABEL(tab); }
function rerender(){
  if (tab === "vHome") renderHome(); else if (tab === "vSubs") renderSubs();
  else if (tab === "vSearch") renderSearch();
}
function go(t){
  if (t === "vHome" && !S.opt.showHome) t = "vSubs";
  tab = t;
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== t);
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === t));
  $("#navHome").hidden = !S.opt.showHome;
  $("#hTitle").textContent = LABEL(t);
  $("#btnRefresh").hidden = !(t === "vHome" || t === "vSubs");
  $("#btnGear").classList.toggle("on", t === "vSettings");
  if (t === "vHome") { renderHome(); if (S.key && !quotaOut() && Date.now() - S.homeFetch > 3 * 3600000) loadHome(); }
  if (t === "vSubs") { renderSubs(); if (!quotaOut() && Date.now() - S.lastFetch > 60 * 60000) refresh(); }
  if (t === "vSearch") { renderSearch(); setTimeout(() => $("#sIn")?.focus(), 50); }
  if (t === "vChannels") renderChannels();
  if (t === "vSettings") renderSettings();
  window.scrollTo(0, 0);
}

async function addChannels(ids, label){
  const fresh = ids.filter(id => !S.channels.some(c => c.id === id));
  if (!fresh.length) { renderChannels("Erano già tutti nella lista."); return; }
  renderChannels(label);
  const info = await channelInfo(fresh);
  S.channels.push(...info.map(c => ({ ...c, manual: true }))); save();
  renderChannels(`Aggiunti ${info.length} canali.`);
  S.lastFetch = 0;
}

let resetArmed = false;
document.addEventListener("click", e => {
  const t = e.target.closest("[data-ch],[data-close],[data-pl],[data-ctab],[data-tab],[data-v],[data-go],[data-act],[data-del],[data-replies],[data-q]"); if (!t) return;
  if (t.dataset.ch) return openChannel(t.dataset.ch);
  if (t.dataset.close) return closeSheet(t.dataset.close);
  if (t.dataset.ctab) return chanTab(t.dataset.ctab);
  if (t.dataset.pl) return openPlaylist(t.dataset.pl, t.dataset.plt);
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.go) { closeSheets(); return go(t.dataset.go); }
  if (t.dataset.v) return openVideo(t.dataset.v);
  if (t.dataset.replies) return loadReplies(t.dataset.replies);
  if (t.dataset.q) { go("vSearch"); $("#sIn").value = t.dataset.q; return doSearch(t.dataset.q); }
  if (t.dataset.del) {
    S.channels = S.channels.filter(c => c.id !== t.dataset.del);
    S.videos = S.videos.filter(v => v.ch !== t.dataset.del); save(); updateBell(); return renderChannels("Canale rimosso.");
  }
  const a = t.dataset.act;
  if (a === "refresh") refresh(true);
  if (a === "home") loadHome(true);
  if (a === "login") startLogin({ do: "sync" });
  if (a === "sync") syncSubs();
  if (a === "csv") $("#csvFile").click();
  if (a === "moreComments") loadComments(false);
  if (a === "chMore") loadChanVideos(false);
  if (a === "chAbout") { $("#cAbout").classList.add("full"); t.remove(); }
  if (a === "subscribe") toggleSub();
  if (a === "vsub" && current) toggleSub(current.ch, current.chTitle, avatarOf(current.ch));
  if (a === "like") rate("like");
  if (a === "dislike") rate("dislike");
  if (a === "share") shareVideo();
  if (a === "vmenu") videoMenu();
  if (a === "closeMenu") closeMenu();
  if (a === "cCC") { ctlShow(true); return ccMenu(); }
  if (a === "ccOff") { closeMenu(); return ccOff(); }
  if (a && a.startsWith("cc:")) {
    closeMenu(); const [, lang, tr] = a.split(":");
    S.opt.cc = lang; S.opt.ccTr = tr || ""; save(); applyCC(lang, tr);
    return toast(tr ? "Sottotitoli tradotti in italiano" : "Sottotitoli attivi");
  }
  if (a === "copyLink") { closeMenu(); navigator.clipboard?.writeText("https://youtu.be/" + current.id).then(() => toast("Link copiato"), () => toast("https://youtu.be/" + current.id)); }
  if (a === "openYT") { closeMenu(); window.open("https://www.youtube.com/watch?v=" + current.id, "_blank"); }
  if (a === "relSearch") searchRelated();
  if (a === "openComments") { $("#cmTitle").textContent = "Commenti" + (current.comments ? " · " + num(current.comments) : ""); openSheet("#cmts"); }
  if (/^c(Play|Back|Fwd|Mute|Rate|Full)$/.test(a)) return ctl(a);
  if (a === "ctlShow") return ctlShow();
  if (a === "unmute") { try { yp.unMute(); yp.setVolume(100); yp.playVideo(); } catch {} t.remove(); }
  if (a === "block" && current) {
    S.blocked[current.ch] = 1; S.home = S.home.filter(v => v.ch !== current.ch); save();
    closeMenu(); toast(`Non vedrai più ${current.chTitle} nella Home`); rerender();
  }
  if (a === "desc") { const d = $("#vDesc"); d.hidden = !d.hidden; t.textContent = d.hidden ? "…altro" : "meno"; }
  if (a === "clearTaste") { S.hist = []; S.blocked = {}; S.homeFetch = 0; save(); toast("Gusti azzerati"); }
  if (a === "clearSeen") { S.watched = {}; save(); toast("Video visti azzerati"); }
  if (a === "reset") {
    if (!resetArmed) { resetArmed = true; t.textContent = "Tocca di nuovo per confermare"; setTimeout(() => { resetArmed = false; if (t.isConnected) t.textContent = "Cancella tutto"; }, 4000); return; }
    resetting = true; try { localStorage.removeItem(LS); } catch {}
    (idb ? idbClear() : Promise.resolve()).then(() => location.reload());
  }
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "sForm") { $("#sIn").blur(); return doSearch($("#sIn").value); }
  if (id === "cForm") { const txt = $("#cIn").value.trim(); if (txt && current) postComment(current, txt); return; }
  if (id === "keyForm") {
    const k = $("#keyIn").value.replace(/[\s"'`]/g, ""); if (!k) return;
    if (!/^AIza[\w-]{35}$/.test(k)) { toast(`La chiave deve iniziare con AIza ed essere lunga 39 caratteri: questa ne ha ${k.length}.`); return; }
    S.key = k; save();
    try { await api("channels", { part: "id", forHandle: "@YouTube" }); toast("Chiave salvata e funzionante"); renderSettings(); }
    catch (err) { toast("La chiave non funziona: " + err.message); renderSettings(); }
  }
  if (id === "clientForm") {
    const c = $("#clientIn").value.replace(/\s/g, ""); if (!c) return;
    if (!/\.apps\.googleusercontent\.com$/.test(c)) { toast("L'ID client deve finire con .apps.googleusercontent.com"); return; }
    S.clientId = c; S.token = ""; save(); toast("ID client salvato"); renderSettings();
  }
  if (id === "addForm") {
    const v = $("#addIn").value; if (!v.trim()) return;
    try { const cid = await resolveChannel(v); await addChannels([cid], "Cerco il canale…"); }
    catch (err) { renderChannels(err.message, true); }
  }
});

document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "o_hide") { S.opt.hideWatched = e.target.checked; save(); }
  if (id === "o_home") { S.opt.showHome = e.target.checked; save(); $("#navHome").hidden = !S.opt.showHome; }
  if (id === "o_region") { S.opt.region = e.target.value; S.homeFetch = 0; save(); }
  if (id === "o_n") { S.opt.perChannel = +e.target.value; save(); renderSettings(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "cIn") { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; }
});

$("#csvFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const ids = [...new Set((await f.text()).match(/UC[\w-]{22}/g) || [])];
  if (!ids.length) return renderChannels("Nel file non ho trovato canali. È il subscriptions.csv di Takeout?", true);
  try { await addChannels(ids, `Trovati ${ids.length} canali, li carico…`); }
  catch (err) { renderChannels(err.message, true); }
});

$("#btnRefresh").onclick = () => tab === "vHome" ? loadHome(true) : refresh(true);
$("#btnSearch").onclick = () => go("vSearch");
$("#btnBell").onclick = openNotifs;
$("#btnGear").onclick = () => { closeSheets(); go("vSettings"); };
$("#logo").onclick = () => { closeSheets(); go("vHome"); };
$("#pClose").onclick = () => closeSheet("#player");
$("#nClose").onclick = () => closeSheet("#notifs");

/* ---------- trascina in basso per aggiornare ---------- */
(() => {
  const el = $("#ptr"), LIMIT = 75;
  let y0 = null, d = 0;
  const sheetOpen = () => !!document.querySelector(".sheet.open,.menu");
  const set = (px, rot) => { el.style.transform = `translateY(${px - 50}px) rotate(${rot}deg)`; el.style.opacity = Math.min(1, px / LIMIT); };
  addEventListener("touchstart", e => {
    if (window.scrollY > 0 || sheetOpen() || !(tab === "vHome" || tab === "vSubs") || e.touches.length > 1) { y0 = null; return; }
    y0 = e.touches[0].clientY; d = 0; el.classList.remove("back");
  }, { passive: true });
  addEventListener("touchmove", e => {
    if (y0 === null) return;
    d = Math.max(0, (e.touches[0].clientY - y0) * 0.5);
    if (window.scrollY > 0) d = 0;
    set(Math.min(d, LIMIT + 25), d * 3);
  }, { passive: true });
  addEventListener("touchend", async () => {
    if (y0 === null) return;
    y0 = null;
    if (d >= LIMIT) {
      el.classList.add("back"); set(LIMIT, 0); el.classList.add("go");
      try { if (navigator.vibrate) navigator.vibrate(10); } catch {}
      await (tab === "vHome" ? loadHome(true) : refresh(true));
      el.classList.remove("go");
    }
    el.classList.add("back"); el.style.transform = "translateY(-50px)"; el.style.opacity = 0;
  }, { passive: true });
})();

/* ---------- aggiornamenti automatici dell'app ----------
   GitHub Pages e Safari tengono in memoria la versione vecchia per qualche minuto:
   se version.json dice che ne esiste una più nuova, la scarico e ricarico la pagina. */
const BUILD = "20261010233009";
async function checkUpdate(){
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const { v } = await r.json();
    if (v && v !== BUILD && !sessionStorage.getItem("ytg.upd." + v)) {
      sessionStorage.setItem("ytg.upd." + v, "1");
      await fetch(location.pathname, { cache: "reload" });
      location.reload();
    }
  } catch {}
}
checkUpdate();
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });

/* ---------- avvio ---------- */
(async () => {
await loadBig();
remember(S.videos); remember(S.home);
const after = readLoginReturn();
if (after?.do === "comment") {
  let v = null; try { v = JSON.parse(sessionStorage.getItem("ytg.video")); } catch {}
  go(after.tab || "vSubs");
  if (v) { CACHE.set(v.id, v); openVideo(v.id); postComment(v, after.text); }
} else if (after?.do === "sub" || after?.do === "rate") {
  let v = null; try { v = JSON.parse(sessionStorage.getItem("ytg.video") || "null"); } catch {}
  go(after.tab || "vSubs");
  if (v) { CACHE.set(v.id, v); openVideo(v.id); }
  if (after.do === "sub") setTimeout(() => toggleSub(after.ch, after.title, after.thumb), 500);
  else if (v) setTimeout(() => { myRating = after.rating === "none" ? "like" : "none"; rate(after.rating === "none" ? "like" : after.rating); }, 500);
} else if (after) { go("vSettings"); syncSubs(); }
else go(S.opt.showHome ? "vHome" : "vSubs");
updateBell();
if (!after && S.channels.length && !quotaOut() && Date.now() - S.lastFetch > 60 * 60000 && tab !== "vSubs") refresh();
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (!quotaOut() && Date.now() - S.lastFetch > 60 * 60000) refresh();
  if (tab === "vHome" && !quotaOut() && Date.now() - S.homeFetch > 3 * 3600000) loadHome();
});
saveNow();
})();
