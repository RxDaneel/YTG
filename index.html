/* Iscriviti / annulla iscrizione sul tuo account YouTube (50 unità) */
async function toggleSub(id, title, thumb){
  id = id || CH.id; title = title || CH.info?.snippet?.title || ""; thumb = thumb || CH.info?.snippet?.thumbnails?.default?.url || "";
  if (!tokenOk()) {
    try { sessionStorage.setItem("ytg.video", current ? JSON.stringify(current) : ""); } catch {}
    return startLogin({ do: "sub", ch: id, title, thumb, video: current?.id || "", tab });
  }
  const btns = [$("#subBtn"), $("#vSub")].filter(Boolean); btns.forEach(b => b.disabled = true);
  try {
    if (isSub(id)) {
      const j = await apiAuth("subscriptions", { part: "id", mine: "true", forChannelId: id });
      const sid = j.items?.[0]?.id;
      if (sid) {
        spend("subscriptions", "DELETE");
        const r = await fetch(API + "subscriptions?id=" + encodeURIComponent(sid), { method: "DELETE", headers: { Authorization: "Bearer " + S.token } });
        if (r.status === 401) { const e = new Error("Sessione scaduta"); e.relogin = true; throw e; }
        if (!r.ok && r.status !== 404) throw new Error("Errore " + r.status);
      }
      S.channels = S.channels.filter(c => c.id !== id); S.videos = S.videos.filter(v => v.ch !== id);
      toast("Iscrizione annullata");
    } else {
      await apiAuth("subscriptions", { part: "snippet" }, { snippet: { resourceId: { kind: "youtube#channel", channelId: id } } });
      S.channels.push({ id, title, thumb }); S.lastFetch = 0; toast("Iscritto a " + title);
    }
    save(); updateBell(); rerender(); paintSub(id);
  } catch (e) {
    if (e.relogin || e.reason === "insufficientPermissions") { S.token = ""; save(); return toggleSub(id, title, thumb); }
    toast("Operazione non riuscita: " + errMsg(e));
  } finally { btns.forEach(b => b.disabled = false); }
}
function paintSub(id){
  const on = isSub(id);
  const a = $("#subBtn"); if (a && CH?.id === id) { a.textContent = on ? "Iscritto ✓" : "Iscriviti"; a.classList.toggle("ghost", on); }
  const b = $("#vSub"); if (b && current?.ch === id) { b.textContent = on ? "Iscritto" : "Iscriviti"; b.classList.toggle("on", on); }
}

/* ---------- scheda "Tu": profilo, playlist, Mi piace, i tuoi video, cronologia di YTG ----------
   Serve l'accesso con Google. Costa circa 5 unità e i dati restano salvati un'ora.
   YouTube non dà alle app esterne né la cronologia né "Guarda più tardi":
   la cronologia mostrata è quella dei video aperti in YTG. */
const ME = { busy: false, err: "", pl: null };
async function authVideos(ids){
  const out = [];
  for (let i = 0; i < ids.length; i += 50) {
    const j = await apiAuth("videos", { part: "snippet,contentDetails,statistics", id: ids.slice(i, i + 50).join(",") });
    out.push(...(j.items || []));
  }
  return out;
}
const notShort = v => v.snippet.liveBroadcastContent !== "upcoming" && !looksShort(v, secs(v.contentDetails?.duration));
async function loadMe(manual){
  if (ME.busy) return;
  if (!tokenOk()) { if (manual) startLogin({ do: "me" }); return; }
  ME.busy = true; ME.err = ""; spin(true); renderMe();
  try {
    const settle = p => p.then(v => v, e => { if (e.relogin) throw e; return { items: [], err: e }; });
    const [ch, pls, liked] = await Promise.all([
      settle(apiAuth("channels", { part: "snippet,contentDetails,statistics", mine: "true" })),
      settle(apiAuth("playlists", { part: "snippet,contentDetails,status", mine: "true", maxResults: 50 })),
      settle(apiAuth("videos", { part: "snippet,contentDetails,statistics", myRating: "like", maxResults: 50 }))
    ]);
    if (!ch.items?.length) ME.err = "L'account con cui hai fatto l'accesso non ha un canale YouTube. In Impostazioni tocca “Cambia account” e scegli quello con le tue iscrizioni.";
    const c = ch.items?.[0];
    let uploads = [];
    const upId = c?.contentDetails?.relatedPlaylists?.uploads;
    if (upId && +c.statistics?.videoCount) {
      const j = await apiAuth("playlistItems", { part: "contentDetails", playlistId: upId, maxResults: 30 });
      const ids = (j.items || []).map(i => i.contentDetails.videoId);
      if (ids.length) uploads = (await authVideos(ids)).map(toVideo).sort((a, b) => b.at.localeCompare(a.at));
    }
    if (c) S.me = { title: c.snippet.title, thumb: c.snippet.thumbnails?.default?.url || "" };
    S.meData = {
      at: Date.now(),
      chan: c ? { id: c.id, title: c.snippet.title, handle: c.snippet.customUrl || "", thumb: c.snippet.thumbnails?.medium?.url || c.snippet.thumbnails?.default?.url || "",
        subs: c.statistics?.hiddenSubscriberCount ? 0 : +c.statistics?.subscriberCount || 0, n: +c.statistics?.videoCount || 0 } : null,
      playlists: (pls.items || []).map(p => ({ id: p.id, title: p.snippet.title, n: p.contentDetails.itemCount,
        thumb: (p.snippet.thumbnails?.medium || p.snippet.thumbnails?.default || {}).url || "", priv: p.status?.privacyStatus || "" })),
      liked: (liked.items || []).filter(notShort).map(toVideo),
      uploads
    };
    remember(S.meData.liked); remember(S.meData.uploads); save();
    if (manual) toast("Profilo aggiornato");
  } catch (e) {
    ME.err = e.relogin ? "Accedi di nuovo per vedere il tuo profilo." : errMsg(e);
  } finally { ME.busy = false; spin(false); renderMe(); }
}

function hcard(x){
  return `<button class="hcard" data-v="${x.id}"><div class="thumb"><img loading="lazy" src="${esc(x.thumb)}" alt="">
    ${x.dur ? `<span class="dur">${fmtDur(x.dur)}</span>` : ""}</div>
    <div class="title">${esc(x.title)}</div><div class="sub">${esc(x.chTitle)}</div></button>`;
}
function myHistory(){
  return Object.entries(S.watched).sort((a, b) => b[1] - a[1]).map(([id]) => CACHE.get(id)).filter(Boolean).slice(0, 30);
}

function renderMe(){
  const v = $("#vMe"); if (!v) return;
  if (ME.pl) return renderMyPlaylist();
  const d = S.meData, hist = myHistory();
  const head = d?.chan
    ? `<div class="mehead"><img src="${esc(d.chan.thumb)}" alt=""><div style="min-width:0"><h2>${esc(d.chan.title)}</h2>
        <div class="sub">${[d.chan.handle, d.chan.subs ? subs(d.chan.subs) : "", d.chan.n ? d.chan.n + " video" : ""].filter(Boolean).map(esc).join(" · ")}</div>
        ${d.chan.id ? `<button class="more" data-ch="${d.chan.id}">Vai al tuo canale ›</button>` : ""}</div></div>`
    : `<div class="mehead"><div style="min-width:0"><h2>${esc(S.me?.title || "Il tuo profilo")}</h2></div></div>`;
  const loginCard = !S.clientId
    ? `<div class="panel" style="margin:4px 16px 8px;padding:14px"><div class="help" style="padding:0">Configura l'accesso con Google nelle impostazioni per vedere qui le tue playlist di YouTube, i video piaciuti e i tuoi video.</div>
        <div style="margin-top:10px"><button class="btn" data-go="vSettings">Apri impostazioni</button></div></div>`
    : `<div class="panel" style="margin:4px 16px 8px;padding:14px"><div class="help" style="padding:0">Accedi con Google per vedere qui le tue playlist di YouTube, i video piaciuti e i tuoi video.</div>
        <div style="margin-top:10px"><button class="btn" data-act="meLogin">Accedi con Google</button></div></div>`;
  const laterRow = `<button class="row" data-act="meLater"><div class="thumb" style="display:grid;place-items:center;background:var(--raised)">
      <svg viewBox="0 0 24 24" width="30" height="30" style="stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></div>
      <div style="min-width:0"><div class="title">Guarda più tardi</div><div class="sub">${S.later.length} video · salvati in YTG</div></div></button>`;
  v.innerHTML = head + `
    ${ME.err ? `<div class="status err" style="padding:0 16px">${esc(ME.err)}</div>` : ""}
    ${ME.busy && !d ? `<div class="status" style="padding:8px 16px">Carico il tuo profilo…</div>` : ""}
    ${(!d && !ME.busy && !tokenOk()) || ME.err.startsWith("Accedi") ? loginCard : ""}

    ${hist.length ? `<div class="shead"><h3>Cronologia</h3><span class="sub">video aperti in YTG</span></div>
      <div class="hrow">${hist.map(hcard).join("")}</div>` : ""}

    <div class="shead"><h3>Playlist</h3><span class="sub">${d ? d.playlists.length + 2 : 1}</span></div>
    ${laterRow}
    ${d ? `<button class="row" data-act="meLiked"><div class="thumb" style="display:grid;place-items:center;background:var(--raised)">
        <svg viewBox="0 0 24 24" width="30" height="30" style="stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M7 10v11H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm0 0 4-7a2.5 2.5 0 0 1 2.6 3L13 10h6a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 21H7"/></svg></div>
        <div style="min-width:0"><div class="title">Video piaciuti</div><div class="sub">${d.liked.length} video</div></div></button>
      ${d.playlists.map(p => `<button class="row" data-mypl="${p.id}"><div class="thumb"><img loading="lazy" src="${esc(p.thumb)}" alt=""><span class="dur">${p.n} video</span></div>
        <div style="min-width:0"><div class="title">${esc(p.title)}</div><div class="sub">Playlist</div></div></button>`).join("")
        || `<div class="status" style="padding:4px 16px">Non hai playlist.</div>`}

      <div class="shead"><h3>I tuoi video</h3><span class="sub">${d.uploads.length || ""}</span></div>
      ${d.uploads.length ? d.uploads.map(rowHTML).join("") : `<div class="status" style="padding:4px 16px 16px">Non hai ancora caricato video.</div>`}
      <div class="status" style="padding:12px 16px 20px">Aggiornato ${ago(new Date(d.at).toISOString())}. Trascina in basso o tocca ↻ per aggiornare.</div>` : ""}`;
}

async function openMyPlaylist(id){
  const d = S.meData;
  if (id === "later") { ME.pl = { id, title: "Guarda più tardi", items: null }; renderMe(); return window.scrollTo(0, 0); }
  if (id === "liked") { ME.pl = { id, title: "Video piaciuti", items: d.liked }; return renderMe(); }
  const p = d.playlists.find(x => x.id === id);
  ME.pl = { id, title: p?.title || "Playlist", items: null }; renderMe(); window.scrollTo(0, 0);
  try {
    if (!tokenOk()) throw Object.assign(new Error("Accedi di nuovo per aprire la playlist."), { relogin: true });
    const j = await apiAuth("playlistItems", { part: "contentDetails", playlistId: id, maxResults: 50 });
    const ids = (j.items || []).map(i => i.contentDetails.videoId);
    const det = ids.length ? await authVideos(ids) : [], order = new Map(ids.map((x, i) => [x, i]));
    if (ME.pl?.id !== id) return;
    ME.pl.items = remember(det.map(toVideo).sort((a, b) => order.get(a.id) - order.get(b.id)));
  } catch (e) { if (ME.pl?.id === id) ME.pl.err = e.relogin ? e.message : errMsg(e); }
  renderMe();
}
function renderMyPlaylist(){
  const v = $("#vMe"), pl = ME.pl;
  if (pl.id === "later") {
    remember(S.later);
    v.innerHTML = `<div style="padding:10px 16px 4px"><button class="more" data-act="meBack">‹ Tu</button>
        <h2 style="font:700 20px/1.25 var(--font);margin:4px 0 0">Guarda più tardi</h2>
        <div class="sub">Salvati su questo telefono. Per aggiungere un video: ⋯ sotto il video → Salva in Guarda più tardi.</div></div>
      ${S.later.length ? S.later.map(x => `<div style="display:flex;align-items:center">${rowHTML(x).replace('class="row"', 'class="row" style="flex:1;min-width:0"')}
          <button class="rbtn" data-unlater="${x.id}" aria-label="Rimuovi" style="margin-right:8px"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`).join("")
        : `<div class="status" style="padding:12px 16px">Ancora nessun video.</div>`}`;
    return;
  }
  v.innerHTML = `<div style="padding:10px 16px 4px"><button class="more" data-act="meBack">‹ Tu</button>
      <h2 style="font:700 20px/1.25 var(--font);margin:4px 0 0">${esc(pl.title)}</h2></div>
    ${pl.err ? `<div class="status err" style="padding:8px 16px">${esc(pl.err)}</div>` : !pl.items ? `<div class="status" style="padding:8px 16px">Carico…</div>`
      : pl.items.length ? pl.items.map(rowHTML).join("") : `<div class="status" style="padding:8px 16px">Playlist vuota.</div>`}`;
}

/* ---------- navigazione ---------- */
const TITLES = { vHome: "Home", vSubs: "Iscrizioni", vSearch: "Cerca", vChannels: "Canali", vSettings: "Impostazioni", vMe: "Tu" };
const LABEL = t => ["vHome", "vSubs", "vMe"].includes(t) ? "" : TITLES[t];   // le schede della barra in basso non ripetono il nome in alto
function progress(done, total){ $("#hTitle").textContent = total && tab === "vSubs" ? `Aggiorno ${done}/${total}` : LABEL(tab); }
function rerender(){
  if (tab === "vHome") renderHome(); else if (tab === "vSubs") renderSubs();
  else if (tab === "vSearch") renderSearch();
  else if (tab === "vMe") renderMe();
}
function go(t){
  if (t === "vHome" && !S.opt.showHome) t = "vSubs";
  tab = t;
  document.querySelectorAll(".view").forEach(v => v.hidden = v.id !== t);
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === t));
  $("#navHome").hidden = !S.opt.showHome;
  $("#hTitle").textContent = LABEL(t);
  $("#btnRefresh").hidden = !(t === "vHome" || t === "vSubs" || t === "vMe");
  $("#btnGear").classList.toggle("on", t === "vSettings");
  if (t === "vHome") { renderHome(); if (S.key && !quotaOut() && Date.now() - S.homeFetch > 3 * 3600000) loadHome(); }
  if (t === "vSubs") { renderSubs(); if (!quotaOut() && Date.now() - S.lastFetch > 60 * 60000) refresh(); }
  if (t === "vSearch") { renderSearch(); setTimeout(() => $("#sIn")?.focus(), 50); }
  if (t === "vChannels") renderChannels();
  if (t === "vMe") { ME.pl = null; renderMe(); if (tokenOk() && Date.now() - (S.meData?.at || 0) > 3600000) loadMe(); }
  if (t === "vSettings") renderSettings();
  window.scrollTo(0, 0);
}

async function addChannels(ids, label){
  const fresh = ids.filter(id => !S.channels.some(c => c.id === id));
  if (!fresh.length) { renderChannels("Erano già tutti nella lista."); return; }
  renderChannels(label);
  const info = await channelInfo(fresh);
  S.channels.push(...info.map(c => ({ ...c, manual: true }))); save();
  renderChannels(`Aggiunti ${info.length} canali.`);
  S.lastFetch = 0;
}

let resetArmed = false;
document.addEventListener("click", e => {
  const t = e.target.closest("[data-cm],[data-nv],[data-unlater],[data-mypl],[data-ch],[data-close],[data-pl],[data-ctab],[data-tab],[data-v],[data-go],[data-act],[data-del],[data-replies],[data-q]"); if (!t) return;
  if (t.dataset.cm) return cardMenu(t.dataset.cm);
  if (t.dataset.nv) {
    const v = CACHE.get(t.dataset.nv); if (!v) return toast("Video non disponibile");

    return setTimeout(() => { $("#cmTitle").textContent = "Commenti"; openSheet("#cmts"); }, 350);
  }
  if (t.dataset.unlater) { e.stopPropagation(); return toggleLater(S.later.find(v => v.id === t.dataset.unlater), false); }
  if (t.dataset.mypl) return openMyPlaylist(t.dataset.mypl);

    S.videos = S.videos.filter(v => v.ch !== t.dataset.del); save(); updateBell(); return renderChannels("Canale rimosso.");
  }
  const a = t.dataset.act;
  if (a === "refresh") refresh(true);
  if (a === "pickAccount") return startLogin({ do: "sync", pick: true });
  if (a === "fullRefresh") { go("vSubs"); refresh(true, true); }

  if (a === "login") startLogin({ do: "sync" });

  if (a === "csv") $("#csvFile").click();

  if (a === "chMore") loadChanVideos(false);

  if (a === "subscribe") toggleSub();

  if (a === "like") rate("like");
  if (a === "dislike") rate("dislike");
  if (a === "share") shareVideo();

  if (a === "closeMenu") closeMenu();
  if (a === "qinfo") { const u = S.qDay === qDay() ? S.qUsed || 0 : 0; return toast(quotaOut() ? "Unità finite per oggi: tornano alle 9:00" : `Oggi: ${u.toLocaleString("it-IT")} unità su 10.000 · si azzerano alle 9:00`); }
  if (a === "mNope") { closeMenu(); return notInterested(menuVideo); }
  if (a === "mBlock" && menuVideo) { closeMenu(); S.blocked[menuVideo.ch] = 1; S.home = S.home.filter(v => v.ch !== menuVideo.ch); save(); rerender(); return toast(`Non vedrai più ${menuVideo.chTitle} nella Home`); }
  if (a === "mLater") { closeMenu(); return toggleLater(menuVideo, true); }
  if (a === "mUnlater") { closeMenu(); return toggleLater(menuVideo, false); }
  if (a === "nopeCur") { closeMenu(); notInterested(current); return closeSheet("#player"); }
  if (a === "laterCur") { closeMenu(); return toggleLater(current, true); }
  if (a === "unlaterCur") { closeMenu(); return toggleLater(current, false); }
  if (a === "meLater") return openMyPlaylist("later");
  if (a === "meLogin") return startLogin({ do: "me" });
  if (a === "meLiked") return openMyPlaylist("liked");
  if (a === "meBack") { ME.pl = null; renderMe(); return window.scrollTo(0, 0); }
  if (a === "cCC") { ctlShow(true); return ccMenu(); }
  if (a === "ccOff") { closeMenu(); return ccOff(); }
  if (a && a.startsWith("cc:")) {
    closeMenu(); const [, lang, tr] = a.split(":");
    S.opt.cc = lang; S.opt.ccTr = tr || ""; save(); applyCC(lang, tr);
    return toast(tr ? "Sottotitoli tradotti in italiano" : "Sottotitoli attivi");
  }
  if (a === "copyLink") { closeMenu(); navigator.clipboard?.writeText("https://youtu.be/" + current.id).then(() => toast("Link copiato"), () => toast("https://youtu.be/" + current.id)); }
  if (a === "openYT") { closeMenu(); window.open("https://www.youtube.com/watch?v=" + current.id, "_blank"); }
  if (a === "relSearch") searchRelated();
  if (a === "openComments") { $("#cmTitle").textContent = "Commenti" + (current.comments ? " · " + num(current.comments) : ""); openSheet("#cmts"); }
  if (/^c(Play|Back|Fwd|Mute|Rate|Full)$/.test(a)) return ctl(a);
  if (a === "ctlShow") return ctlShow();
  if (a === "ctlToggle") { const c = $("#pCtl"); if (c.classList.contains("show")) { clearTimeout(ctlTimer); c.classList.remove("show"); } else ctlShow(); return; }
  if (a === "unmute") { try { yp.unMute(); yp.setVolume(100); yp.playVideo(); } catch {} t.remove(); }
  if (a === "block" && current) {
    S.blocked[current.ch] = 1; S.home = S.home.filter(v => v.ch !== current.ch); save();
    closeMenu(); toast(`Non vedrai più ${current.chTitle} nella Home`); rerender();
  }
  if (a === "desc") { const d = $("#vDesc"); d.hidden = !d.hidden; t.textContent = d.hidden ? "…altro" : "meno"; }
  if (a === "clearTaste") { S.hist = []; S.blocked = {}; S.nope = []; S.hidden = {}; S.homeSeen = {}; S.homeFetch = 0; save(); toast("Gusti azzerati"); }
  if (a === "clearSeen") { S.watched = {}; save(); toast("Video visti azzerati"); }
  if (a === "reset") {
    if (!resetArmed) { resetArmed = true; t.textContent = "Tocca di nuovo per confermare"; setTimeout(() => { resetArmed = false; if (t.isConnected) t.textContent = "Cancella tutto"; }, 4000); return; }
    resetting = true; try { localStorage.removeItem(LS); } catch {}
    (idb ? idbClear() : Promise.resolve()).then(() => location.reload());
  }
});

document.addEventListener("submit", async e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "followForm") {
    const r = parseCommentLink($("#followIn").value);
    if (!r) { toast("Non riconosco il link: deve contenere lc=…"); return; }
    if (!followThread(r.lc, r.v)) { toast("Commento già seguito"); return; }
    toast("Commento seguito: riceverai qui le risposte"); $("#followIn").value = "";
    return loadNotifs(true);
  }
  if (id === "sForm") { $("#sIn").blur(); return doSearch($("#sIn").value); }
  if (id === "cForm") { const txt = $("#cIn").value.trim(); if (txt && current) postComment(current, txt); return; }
  if (id === "keyForm") {
    const k = $("#keyIn").value.replace(/[\s"'`]/g, ""); if (!k) return;
    if (!/^AIza[\w-]{35}$/.test(k)) { toast(`La chiave deve iniziare con AIza ed essere lunga 39 caratteri: questa ne ha ${k.length}.`); return; }
    S.key = k; save();
    try { await api("channels", { part: "id", forHandle: "@YouTube" }); toast("Chiave salvata e funzionante"); renderSettings(); }
    catch (err) { toast("La chiave non funziona: " + err.message); renderSettings(); }
  }
  if (id === "clientForm") {
    const c = $("#clientIn").value.replace(/\s/g, ""); if (!c) return;
    if (!/\.apps\.googleusercontent\.com$/.test(c)) { toast("L'ID client deve finire con .apps.googleusercontent.com"); return; }
    S.clientId = c; S.token = ""; save(); toast("ID client salvato"); renderSettings();
  }
  if (id === "addForm") {
    const v = $("#addIn").value; if (!v.trim()) return;
    try { const cid = await resolveChannel(v); await addChannels([cid], "Cerco il canale…"); }
    catch (err) { renderChannels(err.message, true); }
  }
});

document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "o_hide") { S.opt.hideWatched = e.target.checked; save(); }
  if (id === "o_home") { S.opt.showHome = e.target.checked; save(); $("#navHome").hidden = !S.opt.showHome; }
  if (id === "o_region") { S.opt.region = e.target.value; S.homeFetch = 0; save(); }
  if (id === "o_n") { S.opt.perChannel = +e.target.value; save(); renderSettings(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "cIn") { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; }
});

$("#csvFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const ids = [...new Set((await f.text()).match(/UC[\w-]{22}/g) || [])];
  if (!ids.length) return renderChannels("Nel file non ho trovato canali. È il subscriptions.csv di Takeout?", true);
  try { await addChannels(ids, `Trovati ${ids.length} canali, li carico…`); }
  catch (err) { renderChannels(err.message, true); }
});

$("#btnRefresh").onclick = () => tab === "vHome" ? loadHome(true) : tab === "vMe" ? loadMe(true) : refresh(true);
$("#btnSearch").onclick = () => go("vSearch");
$("#btnBell").onclick = openNotifs;
$("#btnGear").onclick = () => { closeSheets(); go("vSettings"); };
$("#logo").onclick = () => { closeSheets(); go("vHome"); };
$("#pClose").onclick = () => closeSheet("#player");
$("#nClose").onclick = () => closeSheet("#notifs");

/* ---------- trascina in basso per aggiornare ---------- */
(() => {
  const el = $("#ptr"), LIMIT = 75;
  let y0 = null, d = 0;
  const sheetOpen = () => !!document.querySelector(".sheet.open,.menu");
  const set = (px, rot) => { el.style.transform = `translateY(${px - 50}px) rotate(${rot}deg)`; el.style.opacity = Math.min(1, px / LIMIT); };
  addEventListener("touchstart", e => {
    if (window.scrollY > 0 || sheetOpen() || !(tab === "vHome" || tab === "vSubs" || tab === "vMe") || e.touches.length > 1) { y0 = null; return; }
    y0 = e.touches[0].clientY; d = 0; el.classList.remove("back");
  }, { passive: true });
  addEventListener("touchmove", e => {
    if (y0 === null) return;
    d = Math.max(0, (e.touches[0].clientY - y0) * 0.5);
    if (window.scrollY > 0) d = 0;
    set(Math.min(d, LIMIT + 25), d * 3);
  }, { passive: true });
  addEventListener("touchend", async () => {
    if (y0 === null) return;
    y0 = null;
    if (d >= LIMIT) {
      el.classList.add("back"); set(LIMIT, 0); el.classList.add("go");
      try { if (navigator.vibrate) navigator.vibrate(10); } catch {}
      await (tab === "vHome" ? loadHome(true) : tab === "vMe" ? loadMe(true) : refresh(true));
      el.classList.remove("go");
    }
    el.classList.add("back"); el.style.transform = "translateY(-50px)"; el.style.opacity = 0;
  }, { passive: true });
})();

/* ---------- aggiornamenti automatici dell'app ----------
   GitHub Pages e Safari tengono in memoria la versione vecchia per qualche minuto:
   se version.json dice che ne esiste una più nuova, la scarico e ricarico la pagina. */
const BUILD = "20261011083629";
async function checkUpdate(){
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const { v } = await r.json();
    if (v && v !== BUILD && !sessionStorage.getItem("ytg.upd." + v)) {
      sessionStorage.setItem("ytg.upd." + v, "1");
      await fetch(location.pathname, { cache: "reload" });
      location.reload();
    }
  } catch {}
}
checkUpdate();
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });

/* ---------- blocca lo zoom con due dita e col doppio tocco ---------- */
["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
/* il doppio tocco è già bloccato da touch-action: manipulation, così i tocchi rapidi sui pulsanti (es. ≫ due volte) funzionano */
/* se la pagina risulta comunque ingrandita (es. zoom rimasto dal browser), la riporto alla dimensione normale */
const vpMeta = document.querySelector('meta[name="viewport"]'), VP = vpMeta.content;
function resetZoom(){
  const vv = window.visualViewport;
  if (!vv || vv.scale <= 1.01) return;
  vpMeta.content = VP.replace("initial-scale=1", "initial-scale=1.0001");
  setTimeout(() => { vpMeta.content = VP; window.scrollTo(0, window.scrollY); }, 60);
}
window.visualViewport?.addEventListener("resize", () => setTimeout(resetZoom, 250));
document.addEventListener("focusout", () => setTimeout(resetZoom, 150));
addEventListener("pageshow", () => setTimeout(resetZoom, 300));
setTimeout(resetZoom, 500);

/* ---------- avvio ---------- */
(async () => {
await loadBig();
remember(S.videos); remember(S.home);
const after = readLoginReturn();
if (after?.do === "comment") {
  let v = null; try { v = JSON.parse(sessionStorage.getItem("ytg.video")); } catch {}
  go(after.tab || "vSubs");
  if (v) { CACHE.set(v.id, v); openVideo(v.id); postComment(v, after.text); }
} else if (after?.do === "me") {
  go("vMe"); loadMe();
} else if (after?.do === "sub" || after?.do === "rate") {
  let v = null; try { v = JSON.parse(sessionStorage.getItem("ytg.video") || "null"); } catch {}
  go(after.tab || "vSubs");
  if (v) { CACHE.set(v.id, v); openVideo(v.id); }
  if (after.do === "sub") setTimeout(() => toggleSub(after.ch, after.title, after.thumb), 500);
  else if (v) setTimeout(() => { myRating = after.rating === "none" ? "like" : "none"; rate(after.rating === "none" ? "like" : after.rating); }, 500);
} else if (after) { go("vSettings"); syncSubs(); }
else go(S.opt.showHome ? "vHome" : "vSubs");
updateBell(); paintQuota(); setInterval(paintQuota, 60000); setTimeout(() => loadNotifs(), 2500);
if (!after && S.channels.length && !quotaOut() && Date.now() - S.lastFetch > 60 * 60000 && tab !== "vSubs") refresh();
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  loadNotifs();
  if (!quotaOut() && Date.now() - S.lastFetch > 60 * 60000) refresh();
  if (tab === "vHome" && !quotaOut() && Date.now() - S.homeFetch > 3 * 3600000) loadHome();
});
saveNow();
})();
</script>
