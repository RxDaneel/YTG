/* ---------- video simili ----------
   L'API di YouTube non fornisce più i "video correlati". Li ricostruiamo per argomento:
   1) tutti i video già noti all'app (Home, iscrizioni, ricerche) ordinati per somiglianza con quello aperto;
   2) i video popolari della stessa categoria (1 unità, ricordati per 3 ore);
   3) su richiesta, una ricerca con le parole chiave del video (100 unità).
   I video dello stesso canale sono esclusi. */
const STOPW = new Set("il lo la i gli le un una uno di da del della dei delle in con su per tra fra e o ma che non come cosa perché quando questo questa sono è ho ha the a an of to and or in on for with is are my your how what why vs ft feat official video parte part ep episodio".split(" "));
function words(v){
  const t = (v.title || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]+/g, " ").split(/\s+/);
  return new Set(t.filter(w => w.length > 2 && !STOPW.has(w) && !/^\d+$/.test(w)).concat((v.tags || []).map(s => s.toLowerCase())));
}
let relExtra = [];            // risultati della ricerca "simili"
function similar(x){
  const kw = words(x), seen = new Set([x.id]), out = [];
  for (const v of CACHE.values()) {
    if (seen.has(v.id) || v.ch === x.ch || !v.thumb) continue; seen.add(v.id);
    const w = words(v); let s = 0;
    for (const k of w) if (kw.has(k)) s += k.includes(" ") ? 4 : 3;
    if (v.cat && v.cat === x.cat) s += 1;
    if (S.watched[v.id]) s -= 2;
    if (s > 0) out.push([s, v]);
  }
  return out.sort((a, b) => b[0] - a[0] || b[1].at.localeCompare(a[1].at)).map(p => p[1]);
}
function renderRelated(){
  const x = current, box = $("#rel"); if (!x || !box) return;
  const ids = new Set(), list = [];
  for (const v of [...relExtra, ...similar(x)]) if (!ids.has(v.id) && v.ch !== x.ch && v.id !== x.id) { ids.add(v.id); list.push(v); }
  box.innerHTML = list.length ? list.slice(0, 20).map(card).join("") : `<div class="status">Cerco video sullo stesso argomento…</div>`;
}
async function loadRelated(x){
  relExtra = [];
  const c = x.cat; if (!c || !S.key || quotaOut()) return;
  try { ensureAvatars(await catChart(c)); } catch {}
  if (current?.id === x.id) renderRelated();
}
async function searchRelated(){
  const x = current, btn = $("#relMore"); if (!x) return;
  const kw = [...words(x)].filter(k => !k.includes(" ")).slice(0, 5).join(" ") || x.title;
  btn.disabled = true; btn.textContent = "Cerco…";
  try {
    const r = await searchVideos(kw, 25);
    if (current?.id !== x.id) return;
    relExtra = r.list.filter(v => v.ch !== x.ch);
    ensureAvatars(relExtra); renderRelated(); btn.remove();
  } catch (e) { btn.disabled = false; btn.textContent = "Cerca altri video simili · 100 unità"; toast(errMsg(e)); }
}

async function openThread(tid, cid){

    const [th, rp] = await Promise.all([
      api("commentThreads", { part: "snippet", id: tid, textFormat: "plainText" }),
      api("comments", { part: "snippet", parentId: tid, maxResults: 100, textFormat: "plainText" }).catch(() => ({ items: [] }))
    ]);
    if (current?.id !== vid) return;
    const t = th.items?.[0]; if (!t) throw new Error("La conversazione non c'è più (forse il commento è stato eliminato).");
    const reps = (rp.items || []).sort((a, b) => a.snippet.publishedAt.localeCompare(b.snippet.publishedAt));
    $("#cFocus").innerHTML = `<div class="group">La conversazione</div>` + commentHTML(t.snippet.topLevelComment, reps.length ? `<div class="replies">${reps.map(c => commentHTML(c)).join("")}</div>` : "");
    const el = (cid && $("#cFocus").querySelector(`[data-cid="${CSS.escape(cid)}"]`)) || $("#cFocus .cmt");
    el?.classList.add("hl");
    setTimeout(() => el?.scrollIntoView({ block: "center", behavior: "smooth" }), 150);
  } catch (e) { const f = $("#cFocus"); if (f) f.innerHTML = `<div class="status err">${esc(e.message || errMsg(e))}</div>`; }

function openComments(){
  if (!current) return;

async function rate(kind){
  const video = current; if (!video) return;
  const next = myRating === kind ? "none" : kind;
  if (!tokenOk()) {
    try { sessionStorage.setItem("ytg.video", JSON.stringify(video)); } catch {}
    return reauth({ do: "rate", rating: next, video: video.id, tab });
  }
  const prev = myRating; myRating = next; paintRating();
  if (prev === "like" && next !== "like") video.likes = Math.max(0, (video.likes || 1) - 1);
  if (next === "like") video.likes = (video.likes || 0) + 1;
  const l = $("#vLikes"); if (l) l.textContent = video.likes ? num(video.likes) + " Mi piace" : "";
  try {
    spend("videos/rate", "POST");
    const r = await fetch(API + "videos/rate?" + new URLSearchParams({ id: video.id, rating: next }), { method: "POST", headers: { Authorization: "Bearer " + S.token } });
    if (r.status === 401) { S.token = ""; save(); myRating = prev; paintRating(); return rate(kind); }
    if (!r.ok) throw new Error("Errore " + r.status);
    if (next === "like") { S.likes = [{ cat: video.cat, ch: video.ch, tags: video.tags || [] }].concat(S.likes).slice(0, 80); }
    if (next === "dislike") { S.hidden[video.id] = 1; S.nope = [{ cat: video.cat, ch: video.ch, tags: (video.tags || []).slice(0, 8) }].concat(S.nope).slice(0, 300); S.home = S.home.filter(x => x.id !== video.id); }
    S.likedIds = (S.likedIds || []).filter(x => x !== video.id); if (next === "like") S.likedIds.unshift(video.id);
    save();
  } catch (e) { myRating = prev; paintRating(); toast("Non riuscito: " + e.message); }
}

}

/* ---------- sottotitoli ----------
   Il player di YouTube li gestisce con il modulo "captions": lo carico, leggo le lingue disponibili
   e scelgo la traccia. La scelta viene ricordata per i video successivi. */
let ccOn = false;
function ccTracks(){ try { return yp.getOption("captions", "tracklist") || []; } catch { return []; } }
function applyCC(lang, tr){
  if (!ok()) return;
  try {
    yp.loadModule("captions");
    const tracks = ccTracks();
    const pick = tracks.find(t => t.languageCode === lang) || tracks.find(t => t.languageCode?.startsWith(lang.split("-")[0])) || tracks[0];
    if (!pick && tracks.length === 0) { ccOn = true; paintCC(); return; }      // modulo caricato, tracce ancora in arrivo
    const opt = { languageCode: pick.languageCode };
    if (tr && pick.languageCode !== tr) opt.translationLanguage = { languageCode: tr };
    yp.setOption("captions", "track", opt);
    ccOn = true;
  } catch {}
  paintCC();
}
function ccOff(){
  try { yp.setOption("captions", "track", {}); yp.unloadModule("captions"); } catch {}
  ccOn = false; S.opt.cc = ""; S.opt.ccTr = ""; save(); paintCC();
}
function paintCC(){ $("#cCC")?.classList.toggle("on", ccOn); }
async function ccMenu(){
  if (!ok()) return;
  try { yp.loadModule("captions"); } catch {}
  let tracks = ccTracks();
  for (let i = 0; i < 8 && !tracks.length; i++) { await new Promise(r => setTimeout(r, 250)); tracks = ccTracks(); }
  if (!tracks.length) { if (!ccOn) { try { yp.unloadModule("captions"); } catch {} } toast("Questo video non ha sottotitoli"); return; }
  const items = tracks.slice(0, 12).map(t => ["cc:" + t.languageCode, (t.displayName || t.languageName || t.languageCode) + (t.kind === "asr" ? " (automatici)" : "")]);
  if (!tracks.some(t => t.languageCode?.startsWith("it"))) items.push(["cc:" + tracks[0].languageCode + ":it", "Traduci in italiano"]);
  if (ccOn) items.push(["ccOff", "Disattiva sottotitoli"]);
  items.push(["closeMenu", "Annulla"]);
  showMenu(items);
}

/* ---------- link nelle descrizioni e nei commenti ----------
   Video di YouTube → si aprono qui (dal punto indicato con t=). Canali → pagina del canale qui.
   Orari tipo 4:05 → saltano a quel punto del video aperto. Tutto il resto → fuori dall'app. */
const URL_RE = /\b((?:https?:\/\/|www\.)[^\s<>"']+[^\s<>"'.,;:!?)\]])/gi;
function parseT(s){
  if (!s) return 0; if (/^\d+s?$/.test(s)) return parseInt(s);
  const m = s.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/); return m ? (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0;
}
function ytTarget(u){
  let url; try { url = new URL(/^https?:/i.test(u) ? u : "https://" + u); } catch { return null; }
  const h = url.hostname.toLowerCase().replace(/^(www\.|m\.|music\.)/, ""), q = url.searchParams, t = parseT(q.get("t") || q.get("start") || "");
  if (h === "youtu.be") { const id = url.pathname.slice(1, 12); return /^[\w-]{11}$/.test(id) ? { v: id, t } : null; }
  if (h !== "youtube.com" && h !== "youtube-nocookie.com") return null;
  if (/^[\w-]{11}$/.test(q.get("v") || "")) return { v: q.get("v"), t };
  let m = url.pathname.match(/^\/(?:shorts|live|embed|v)\/([\w-]{11})/); if (m) return { v: m[1], t };
  m = url.pathname.match(/^\/channel\/(UC[\w-]{22})/); if (m) return { ch: m[1] };
  m = url.pathname.match(/^\/(@[\w.\-]+)\/?/); if (m) return { handle: m[1] };
  return null;
}
const BROWSERS = { "": "Automatico (decide iOS)", safari: "Safari", chrome: "Chrome", firefox: "Firefox", edge: "Edge", brave: "Brave" };
function extHref(h){
  switch (S.opt.browser) {
    case "safari": return "x-safari-" + h;
    case "chrome": return h.replace(/^https?/i, m => m.toLowerCase() === "https" ? "googlechromes" : "googlechrome");
    case "firefox": return "firefox://open-url?url=" + encodeURIComponent(h);
    case "edge": return "microsoft-edge-" + h;
    case "brave": return "brave://open-url?url=" + encodeURIComponent(h);
    default: return h;
  }
}
const tSecs = t => t.split(":").reduce((a, x) => a * 60 + (+x), 0);
const linkTimes = (h, on) => on ? h.replace(/(^|[\s(\[])((?:\d{1,2}:)?\d{1,2}:\d{2})(?=[\s)\],.:;!?\-]|$)/g, (_, a, t) => `${a}<a class="lnk" href="#" data-seek="${tSecs(t)}">${t}</a>`) : h;
function linkify(text, times){
  const s = String(text || ""); let out = "", last = 0;
  for (const m of s.matchAll(URL_RE)) {
    out += linkTimes(esc(s.slice(last, m.index)), times);
    const u = m[1], y = ytTarget(u), href = /^https?:/i.test(u) ? u : "https://" + u;
    const shown = u.replace(/^https?:\/\/(www\.)?/i, ""), label = esc(shown.length > 60 ? shown.slice(0, 57) + "…" : shown);
    out += y ? `<a class="lnk" href="${esc(href)}" data-yt="${esc(JSON.stringify(y))}">${label}</a>`
      : `<a class="lnk" href="${esc(extHref(href))}"${S.opt.browser ? "" : ` target="_blank"`} rel="noopener">${label}</a>`;
    last = m.index + u.length;
  }
  return out + linkTimes(esc(s.slice(last)), times);
}
async function openYtLink(y){

async function chanTab(tabName){
  CH.tab = tabName;
  document.querySelectorAll(".ctabs button").forEach(b => b.setAttribute("aria-current", b.dataset.ctab === tabName));
  const list = $("#chList"), btn = $("#chMoreBtn");
  if ($("#chSearch")) $("#chSearch").hidden = tabName !== "videos";
  if (tabName === "videos") { if ($("#chQ")?.value) return chanFilter(); list.innerHTML = CH.vids.map(rowHTML).join(""); btn.hidden = !CH.page; return; }
  btn.hidden = true;
  if (!CH.playlists) {
    list.innerHTML = `<div class="status" style="padding:12px 16px">Carico le playlist…</div>`;
    try {
      const j = await api("playlists", { part: "snippet,contentDetails", channelId: CH.id, maxResults: 50 });
      CH.playlists = j.items || [];
    } catch (e) { list.innerHTML = `<div class="status err" style="padding:12px 16px">${esc(errMsg(e))}</div>`; return; }
  }
  if (CH.tab !== "playlists") return;
  list.innerHTML = CH.playlists.length ? CH.playlists.map(p => {
    const t = p.snippet.thumbnails || {};
    return `<button class="row" data-pl="${p.id}" data-plt="${esc(p.snippet.title)}"><div class="thumb"><img loading="lazy" src="${esc((t.medium || t.default || {}).url || "")}" alt="">
      <span class="dur">${p.contentDetails.itemCount} video</span></div>
      <div style="min-width:0"><div class="title">${esc(p.snippet.title)}</div><div class="sub">Playlist</div></div></button>`;
  }).join("") : `<div class="status" style="padding:12px 16px">Questo canale non ha playlist pubbliche.</div>`;
}

async function openPlaylist(plId, title){
  const list = $("#chList");
  list.innerHTML = `<div style="padding:8px 16px"><button class="more" data-ctab="playlists">‹ Tutte le playlist</button>

/* Iscriviti / annulla iscrizione sul tuo account YouTube (50 unità) */
async function toggleSub(id, title, thumb){
  id = id || CH.id; title = title || CH.info?.snippet?.title || ""; thumb = thumb || CH.info?.snippet?.thumbnails?.default?.url || "";
  if (!tokenOk()) {
    try { sessionStorage.setItem("ytg.video", current ? JSON.stringify(current) : ""); } catch {}
    return reauth({ do: "sub", ch: id, title, thumb, video: current?.id || "", tab });
  }
  const btns = [$("#subBtn"), $("#vSub")].filter(Boolean); btns.forEach(b => b.disabled = true);
  try {
    if (isSub(id)) {
      const j = await apiAuth("subscriptions", { part: "id", mine: "true", forChannelId: id });
      const sid = j.items?.[0]?.id;
      if (sid) {
        spend("subscriptions", "DELETE");
        const r = await fetch(API + "subscriptions?id=" + encodeURIComponent(sid), { method: "DELETE", headers: { Authorization: "Bearer " + S.token } });
        if (r.status === 401) { const e = new Error("Sessione scaduta"); e.relogin = true; throw e; }
        if (!r.ok && r.status !== 404) throw new Error("Errore " + r.status);
      }
      S.channels = S.channels.filter(c => c.id !== id); S.videos = S.videos.filter(v => v.ch !== id);
      toast("Iscrizione annullata");
    } else {
      await apiAuth("subscriptions", { part: "snippet" }, { snippet: { resourceId: { kind: "youtube#channel", channelId: id } } });
      S.channels.push({ id, title, thumb }); S.lastFetch = 0; toast("Iscritto a " + title);
    }
    save(); updateBell(); rerender(); paintSub(id);
  } catch (e) {
    if (e.relogin || e.reason === "insufficientPermissions") { S.token = ""; save(); return toggleSub(id, title, thumb); }
    toast("Operazione non riuscita: " + errMsg(e));
  } finally { btns.forEach(b => b.disabled = false); }
}
function paintSub(id){
  const on = isSub(id);
  const a = $("#subBtn"); if (a && CH?.id === id) { a.textContent = on ? "Iscritto ✓" : "Iscriviti"; a.classList.toggle("ghost", on); }
  const b = $("#vSub"); if (b && current?.ch === id) { b.textContent = on ? "Iscritto" : "Iscriviti"; b.classList.toggle("on", on); }
}

/* ---------- scheda "Tu": profilo, playlist, Mi piace, i tuoi video, cronologia di YTG ----------
   Serve l'accesso con Google. Costa circa 5 unità e i dati restano salvati un'ora.
   YouTube non dà alle app esterne né la cronologia né "Guarda più tardi":
   la cronologia mostrata è quella dei video aperti in YTG. */
const ME = { busy: false, err: "", pl: null };
async function authVideos(ids){
  const out = [];
  for (let i = 0; i < ids.length; i += 50) {
    const j = await apiAuth("videos", { part: "snippet,contentDetails,statistics", id: ids.slice(i, i + 50).join(",") });
    out.push(...(j.items || []));
  }
  return out;
}
/* Tutti i video a cui hai messo Mi piace. Si legge la playlist "Mi piace" dell'account (LL), che li contiene tutti:
   la lista "myRating=like" di YouTube ne restituisce solo una parte. 2 unità ogni 50 video.
   Una volta al giorno (o quando aggiorni a mano) li rilegge tutti; le altre volte solo i nuovi in cima. */
async function fetchLiked(prev, full){
  const known = new Set(prev.map(v => v.id)), ids = []; let tok = "", pages = 0, hitKnown = false, src = "LL";
  try {
    do {
      const j = await apiAuth("playlistItems", { part: "contentDetails", playlistId: "LL", maxResults: 50, ...(tok ? { pageToken: tok } : {}) });
      const got = (j.items || []).map(i => i.contentDetails.videoId); ids.push(...got); tok = j.nextPageToken || ""; pages++;
      if (!full && got.some(id => known.has(id))) { hitKnown = true; break; }
    } while (tok && pages < 100);
  } catch (e) { if (e.relogin || e.reason === "quotaExceeded") throw e; }
  if (!ids.length) {                                                   // ripiego: la lista "like" di YouTube
    src = "rating"; tok = ""; pages = 0;
    do {
      const j = await apiAuth("videos", { part: "id", myRating: "like", maxResults: 50, ...(tok ? { pageToken: tok } : {}) });
      ids.push(...(j.items || []).map(v => v.id)); tok = j.nextPageToken || ""; pages++;
    } while (tok && pages < 100);
  }
  const need = ids.filter(id => !known.has(id) || full);
  const det = new Map((need.length ? await authVideos(need) : []).map(v => [v.id, v]));
  const old = new Map(prev.map(v => [v.id, v]));
  let shorts = 0; const list = [];
  for (const id of ids) {
    const v = det.get(id);
    if (v) { if (notShort(v)) list.push({ ...toVideo(v), desc: "" }); else shorts++; }
    else if (old.has(id)) list.push(old.get(id));
  }
  if (!full && hitKnown) { const have = new Set(list.map(v => v.id)); list.push(...prev.filter(v => !have.has(v.id))); }
  return { list, shorts, total: ids.length, src };
}
const notShort = v => v.snippet.liveBroadcastContent !== "upcoming" && !looksShort(v, secs(v.contentDetails?.duration));
async function loadMe(manual){
  if (ME.busy) return;
  if (!tokenOk()) {
    const silentOk = S.me && (!S.silentFail || Date.now() - S.silentFail > 6 * 3600000);
    if (manual || silentOk) reauth({ do: "me" });     // in automatico solo il rinnovo silenzioso, mai la pagina di accesso
    return;
  }
  ME.busy = true; ME.err = ""; spin(true); renderMe();
  try {
    const settle = p => p.then(v => v, e => { if (e.relogin) throw e; return { items: [], err: e }; });
    const prev = S.meData, fullLikes = manual || !prev?.likedFull || Date.now() - prev.likedFull > 24 * 3600000;
    const [ch, pls, liked] = await Promise.all([
      settle(apiAuth("channels", { part: "snippet,contentDetails,statistics", mine: "true" })),
      settle(apiAuth("playlists", { part: "snippet,contentDetails,status", mine: "true", maxResults: 50 })),
      settle(fetchLiked(prev?.liked || [], fullLikes))
    ]);
    if (!ch.items?.length) ME.err = "L'account con cui hai fatto l'accesso non ha un canale YouTube. In Impostazioni tocca “Cambia account” e scegli quello con le tue iscrizioni.";
    const c = ch.items?.[0];
    let uploads = [];
    const upId = c?.contentDetails?.relatedPlaylists?.uploads;
    if (upId && +c.statistics?.videoCount) {
      const j = await apiAuth("playlistItems", { part: "contentDetails", playlistId: upId, maxResults: 30 });
      const ids = (j.items || []).map(i => i.contentDetails.videoId);
      if (ids.length) uploads = (await authVideos(ids)).map(toVideo).sort((a, b) => b.at.localeCompare(a.at));
    }
    if (c) S.me = { title: c.snippet.title, thumb: c.snippet.thumbnails?.default?.url || "" };
    S.meData = {
      at: Date.now(),
      chan: c ? { id: c.id, title: c.snippet.title, handle: c.snippet.customUrl || "", thumb: c.snippet.thumbnails?.medium?.url || c.snippet.thumbnails?.default?.url || "",
        subs: c.statistics?.hiddenSubscriberCount ? 0 : +c.statistics?.subscriberCount || 0, n: +c.statistics?.videoCount || 0 } : null,
      playlists: (pls.items || []).map(p => ({ id: p.id, title: p.snippet.title, n: p.contentDetails.itemCount,
        thumb: (p.snippet.thumbnails?.medium || p.snippet.thumbnails?.default || {}).url || "", priv: p.status?.privacyStatus || "" })),
      liked: liked.err ? prev?.liked || [] : liked.list,
      likedFull: liked.err ? prev?.likedFull || 0 : fullLikes ? Date.now() : prev?.likedFull || 0,
      likedShorts: liked.err ? prev?.likedShorts || 0 : fullLikes ? liked.shorts : prev?.likedShorts || 0,
      uploads
    };
    remember(S.meData.liked); remember(S.meData.uploads);
    S.likedIds = [...new Set(S.meData.liked.map(v => v.id).concat(S.likedIds || []))].slice(0, 5000); save();
    if (manual) toast(liked.err ? "Mi piace non letti: " + errMsg(liked.err) : `Profilo aggiornato · ${S.meData.liked.length} video piaciuti` + (S.meData.likedShorts ? ` (${S.meData.likedShorts} Shorts esclusi)` : ""));
  } catch (e) {
    ME.err = e.relogin ? "Accedi di nuovo per vedere il tuo profilo." : errMsg(e);
  } finally { ME.busy = false; spin(false); renderMe(); }
}

async function openMyPlaylist(id){
  const d = S.meData; ME.plShow = 60; ME.laterShow = 60;
  if (id === "later") { ME.pl = { id, title: "Guarda più tardi", items: null }; renderMe(); return toTop(); }
  if (id === "marks") { ME.pl = { id, title: "Segnalibri", items: null }; renderMe(); return toTop(); }
  if (id === "liked") { ME.pl = { id, title: "Video piaciuti", items: d.liked }; return renderMe(); }
  const p = d.playlists.find(x => x.id === id);
  ME.pl = { id, title: p?.title || "Playlist", items: null }; renderMe(); toTop();
  try {
    if (!tokenOk()) throw Object.assign(new Error("Accedi di nuovo per aprire la playlist."), { relogin: true });
    const ids = []; let tok = "", pages = 0;
    do {
      const j = await apiAuth("playlistItems", { part: "contentDetails", playlistId: id, maxResults: 50, ...(tok ? { pageToken: tok } : {}) });
      ids.push(...(j.items || []).map(i => i.contentDetails.videoId)); tok = j.nextPageToken || ""; pages++;
    } while (tok && pages < 20);
    const det = ids.length ? await authVideos(ids) : [], order = new Map(ids.map((x, i) => [x, i]));
    if (ME.pl?.id !== id) return;
    ME.pl.items = remember(det.map(toVideo).sort((a, b) => order.get(a.id) - order.get(b.id)));
  } catch (e) { if (ME.pl?.id === id) ME.pl.err = e.relogin ? e.message : errMsg(e); }
  renderMe();
}

    ${ME.laterMsg ? `<div class="status" style="padding:10px 0 0">${esc(ME.laterMsg)}</div>` : ""}</div>`;

function idsFromText(t){
  const out = [], seen = new Set(), add = (id, at) => { if (!seen.has(id)) { seen.add(id); out.push({ id, at }); } };
  for (const line of String(t).split(/\r?\n/)) {
    const m = line.match(/^\s*"?([A-Za-z0-9_-]{11})"?\s*,\s*"?([^,"]*)/);
    if (m && /\d{4}-\d\d-\d\d/.test(m[2])) { add(m[1], Date.parse(m[2]) || 0); continue; }
    for (const u of line.matchAll(/(?:youtube\.com\/(?:watch\?(?:[^\s]*&)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/g)) add(u[1], 0);
  }
  return out;
}
async function importLater(text){
  const found = idsFromText(text).filter(x => !inLater(x.id));
  if (!found.length) { ME.laterMsg = idsFromText(text).length ? "Questi video sono già in Guarda più tardi." : "Non ho trovato video nel file o nel testo."; return renderMe(); }
  if (!S.key) { ME.laterMsg = "Aggiungi prima la chiave API nelle impostazioni."; return renderMe(); }
  ME.laterMsg = `Importo ${found.length} video…`; renderMe();
  try {
    const det = new Map((await videoDetails(found.map(x => x.id))).filter(v => v.snippet).map(v => [v.id, v]));
    const now = Date.now();
    const add = found.filter(x => det.has(x.id)).map((x, i) => ({ ...toVideo(det.get(x.id)), desc: "", savedAt: x.at || now - i }));
    S.later = S.later.concat(add).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0)).slice(0, 5000);
    remember(add); save();
    const miss = found.length - add.length;
    ME.laterMsg = `Importati ${add.length} video` + (miss ? ` · ${miss} non più disponibili (privati o eliminati)` : "") + ".";
    ensureAvatars(add);
  } catch (e) { ME.laterMsg = "Errore: " + errMsg(e); }
  renderMe();
}

/* ---------- trascina in basso per aggiornare ---------- */
(() => {
  const el = $("#ptr"), LIMIT = 75;
  let y0 = null, d = 0;
  const sheetOpen = () => !!document.querySelector(".sheet.open,.menu");
  const set = (px, rot) => { el.style.transform = `translateY(${px - 50}px) rotate(${rot}deg)`; el.style.opacity = Math.min(1, px / LIMIT); };
  addEventListener("touchstart", e => {
    if ($("#main").scrollTop > 0 || sheetOpen() || !(tab === "vHome" || tab === "vSubs" || tab === "vMe") || e.touches.length > 1) { y0 = null; return; }
    y0 = e.touches[0].clientY; d = 0; el.classList.remove("back");
  }, { passive: true });
  addEventListener("touchmove", e => {
    if (y0 === null) return;
    d = Math.max(0, (e.touches[0].clientY - y0) * 0.5);
    if ($("#main").scrollTop > 0) d = 0;
    set(Math.min(d, LIMIT + 25), d * 3);
  }, { passive: true });
  addEventListener("touchend", async () => {
    if (y0 === null) return;
    y0 = null;
    if (d >= LIMIT) {
      el.classList.add("back"); set(LIMIT, 0); el.classList.add("go");
      try { if (navigator.vibrate) navigator.vibrate(10); } catch {}
      await (tab === "vHome" ? loadHome(true) : tab === "vMe" ? loadMe(true) : refresh(true));
      el.classList.remove("go");
    }
    el.classList.add("back"); el.style.transform = "translateY(-50px)"; el.style.opacity = 0;
  }, { passive: true });
})();

/* ---------- aggiornamenti automatici dell'app ----------
   GitHub Pages e Safari tengono in memoria la versione vecchia per qualche minuto:
   se version.json dice che ne esiste una più nuova, la scarico e ricarico la pagina. */
const BUILD = "20261025132215";
async function checkUpdate(){
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    const { v } = await r.json();
    if (v && v !== BUILD && sessionStorage.getItem("ytg.upd") !== v + ":" + Math.floor(Date.now() / 300000)) {
      sessionStorage.setItem("ytg.upd", v + ":" + Math.floor(Date.now() / 300000));   // al massimo un tentativo ogni 5 minuti
      saveNow();
      await fetch(location.pathname, { cache: "reload" }).catch(() => {});
      location.replace(location.pathname + "?v=" + v);
    }
  } catch {}
}
checkUpdate();
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });

document.addEventListener("touchmove", e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
/* il doppio tocco è già bloccato da touch-action: manipulation, così i tocchi rapidi sui pulsanti (es. ≫ due volte) funzionano */
/* se la pagina risulta comunque ingrandita (es. zoom rimasto dal browser), la riporto alla dimensione normale */
const vpMeta = document.querySelector('meta[name="viewport"]'), VP = vpMeta.content;
function resetZoom(){
  const vv = window.visualViewport;
  if (!vv || vv.scale <= 1.01) return;
  vpMeta.content = VP.replace("initial-scale=1", "initial-scale=1.0001");
  setTimeout(() => { vpMeta.content = VP; window.scrollTo(0, window.scrollY); }, 60);
}
window.visualViewport?.addEventListener("resize", () => setTimeout(resetZoom, 250));
document.addEventListener("focusout", () => setTimeout(() => { resetZoom(); window.scrollTo(0, 0); }, 150));
const fixViewport = () => { if (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop) { window.scrollTo(0, 0); document.body.scrollTop = 0; } };
addEventListener("scroll", fixViewport, { passive: true });
window.visualViewport?.addEventListener("scroll", () => { if (!document.activeElement?.matches?.("input,textarea")) fixViewport(); });
addEventListener("pageshow", () => setTimeout(resetZoom, 300));
setTimeout(resetZoom, 500);

/* ---------- avvio ---------- */
(async () => {
await loadBig();
remember(S.videos); remember(S.home);
if (location.search.includes("v=")) history.replaceState(null, "", location.pathname + location.hash);
const after = readLoginReturn();
if (after?.do === "comment") {
  let v = null; try { v = JSON.parse(sessionStorage.getItem("ytg.video")); } catch {}
  go(after.tab || "vSubs");
  if (v) { CACHE.set(v.id, v); openVideo(v.id); postComment(v, after.text); }
} else if (after?.do === "me") {
  go("vMe"); loadMe();
} else if (after?.do === "sub" || after?.do === "rate") {
  let v = null; try { v = JSON.parse(sessionStorage.getItem("ytg.video") || "null"); } catch {}
  go(after.tab || "vSubs");
  if (v) { CACHE.set(v.id, v); openVideo(v.id); }
  if (after.do === "sub") setTimeout(() => toggleSub(after.ch, after.title, after.thumb), 500);
  else if (v) setTimeout(() => { myRating = after.rating === "none" ? "like" : "none"; rate(after.rating === "none" ? "like" : after.rating); }, 500);
} else if (after?.do === "silentFailed") {
  const o = after.orig || {};
  go(o.tab || (o.do === "me" ? "vMe" : S.opt.showHome ? "vHome" : "vSubs"));
  setTimeout(() => toast("Google chiede di confermare l'accesso: tocca Accedi con Google"), 400);
} else if (after) {
  const needSync = after.force || after.pick || !S.channels.length || Date.now() - (S.lastSync || 0) > 7 * 864e5;
  if (needSync) { go("vSettings"); syncSubs(); }
  else { go(after.tab || (S.opt.showHome ? "vHome" : "vSubs")); setTimeout(() => toast("Accesso rinnovato"), 300); }
}
else go(S.opt.showHome ? "vHome" : "vSubs");
updateBell(); paintQuota(); setInterval(paintQuota, 60000); setTimeout(() => loadNotifs(), 2500);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  loadNotifs();
  if (tab === "vSubs" && !quotaOut() && Date.now() - S.lastFetch > 2 * 3600000) refresh();
  if (tab === "vHome" && !quotaOut() && Date.now() - S.homeFetch > 15 * 60000) loadHome(false, false, true);
});
saveNow();
})();
</script>
